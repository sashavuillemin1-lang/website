<title>Clase con Elena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a video-call room. Lobby = carnet de l'élève (progress, devoirs); Call = video tile + live transcript with correction slips. */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --surface-2:#ebe8e1; --line:#d9d4c9;
  --fg:#1d2427; --muted:#5f686b;
  --accent:#c6531f;        /* pimentón */
  --accent-ink:#ffffff;
  --sky:#1f5a6b;           /* english teal */
  --ok:#2f8a5b; --warn:#b5761a; --err:#c23b3b;
  --err-bg:#fbe9e6; --ok-bg:#e5f3ea;
  --call:#121a1d; --call-2:#1b2629; --call-fg:#eef2ef; --call-muted:#94a3a6;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13181a; --surface:#1b2225; --surface-2:#232c30; --line:#334046;
  --fg:#e8ecea; --muted:#9aa6a9; --accent:#ef7a45; --accent-ink:#1a0f09; --sky:#6cb6c9;
  --ok:#5fc78f; --warn:#e3a649; --err:#ff8a7a; --err-bg:#3a2220; --ok-bg:#1d3327;
  --call:#0c1214; --call-2:#162024; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13181a; --surface:#1b2225; --surface-2:#232c30; --line:#334046;
  --fg:#e8ecea; --muted:#9aa6a9; --accent:#ef7a45; --accent-ink:#1a0f09; --sky:#6cb6c9;
  --ok:#5fc78f; --warn:#e3a649; --err:#ff8a7a; --err-bg:#3a2220; --ok-bg:#1d3327;
  --call:#0c1214; --call-2:#162024; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.label{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:600;transition:transform .12s, background .12s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.muted{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;max-width:calc(100% - 32px);font-weight:500}

/* ---------- onboarding ---------- */
.onb{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.onb-card{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:18px}
.onb-card h1{font-size:clamp(28px,5vw,38px)}
.onb-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.onb-row{grid-template-columns:1fr}}

/* ---------- lobby ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}
.brand canvas{width:48px;height:48px;border-radius:50%;background:var(--call)}
.brand h1{font-size:22px}
.hello{font-size:clamp(30px,5vw,48px);margin-bottom:6px}
.lang-tabs{display:flex;gap:8px;flex-wrap:wrap}
.lang-tab{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;min-width:150px;text-align:left}
.lang-tab b{font-family:var(--f-display);font-size:18px}
.lang-tab[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lang-tab.en[aria-pressed="true"]{border-color:var(--sky);box-shadow:inset 0 0 0 1px var(--sky)}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;margin-top:20px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:20px}
.join{background:var(--call);color:var(--call-fg);border:none;overflow:hidden;position:relative}
.join .label{color:var(--call-muted)}
.join-stage{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:560px){.join-stage{grid-template-columns:1fr}}
.join-stage canvas{width:100%;max-width:200px;aspect-ratio:1;border-radius:16px;background:var(--call-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--call-fg);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--call-fg);color:var(--call)}
.join .btn.primary{margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:10px;padding:12px}
.stat b{display:block;font:700 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.weak{display:flex;flex-direction:column;gap:10px}
.weak-row{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:10px;align-items:center}
.weak-row .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.weak-row .bar i{display:block;height:100%;background:var(--err)}
.weak-row.better .bar i{background:var(--ok)}
.weak-row small{color:var(--muted);display:block}
.hw{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.hw-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.pill{font:500 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.todo{background:var(--err-bg);color:var(--err)}
.pill.done{background:var(--ok-bg);color:var(--ok)}
.ex{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-top:1px dashed var(--line)}
.ex textarea{min-height:44px;resize:vertical;width:100%}
.ex .fb{font-size:14px;border-radius:8px;padding:8px 10px}
.ex .fb.good{background:var(--ok-bg)}
.ex .fb.bad{background:var(--err-bg)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;gap:6px;align-items:center}
.hist{display:flex;flex-direction:column;gap:10px}
.hist-item{border-left:3px solid var(--line);padding-left:12px}
.hist-item time{font:12px var(--f-mono);color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:12px;border:1px dashed var(--line);border-radius:10px}
.vocab{display:flex;flex-wrap:wrap;gap:6px}
.vocab span{background:var(--surface-2);border-radius:8px;padding:4px 8px;font-size:13px}
.vocab span em{color:var(--muted);font-style:normal}

/* ---------- call ---------- */
.call{position:fixed;inset:0;background:var(--call);color:var(--call-fg);display:flex;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.call-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.call-top .label{color:var(--call-muted)}
.rec{display:flex;align-items:center;gap:8px;font:13px var(--f-mono);font-variant-numeric:tabular-nums}
.rec i{width:8px;height:8px;border-radius:50%;background:#58d68d;box-shadow:0 0 0 3px rgba(88,214,141,.2)}
.call-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:12px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
@media (max-width:820px){.call-body{grid-template-columns:1fr;grid-template-rows:minmax(200px,42%) minmax(0,1fr)}}
.stage{position:relative;border-radius:18px;overflow:hidden;background:var(--call-2);min-height:0}
.stage canvas.teacher{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border-radius:8px;padding:5px 10px;font-size:13px;display:flex;align-items:center;gap:8px}
.tag .dot{width:7px;height:7px;border-radius:50%;background:var(--call-muted)}
.tag.speaking .dot{background:#58d68d}
.tag.thinking .dot{background:#f0c05a;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.captions{position:absolute;left:50%;transform:translateX(-50%);bottom:52px;width:min(88%,640px);text-align:center;font-size:clamp(15px,2vw,19px);line-height:1.35;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.captions span{background:rgba(0,0,0,.6);padding:2px 8px;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.captions small{display:block;margin-top:6px;font-size:.8em;opacity:.8}
.self{position:absolute;right:12px;top:12px;width:clamp(96px,18%,160px);aspect-ratio:4/3;border-radius:12px;background:linear-gradient(135deg,#2b3a3f,#1e2a2e);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;overflow:hidden}
.self .avatar{width:44%;aspect-ratio:1;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 clamp(14px,2vw,22px) var(--f-display);transition:box-shadow .15s}
.self.live .avatar{box-shadow:0 0 0 4px rgba(88,214,141,.5),0 0 0 9px rgba(88,214,141,.18);animation:breathe 1.2s infinite}
@keyframes breathe{50%{box-shadow:0 0 0 6px rgba(88,214,141,.35),0 0 0 14px rgba(88,214,141,.1)}}
.self small{position:absolute;left:8px;bottom:6px;font-size:11px;color:var(--call-muted)}
.side{display:flex;flex-direction:column;min-height:0;background:var(--call-2);border-radius:18px;overflow:hidden}
.side-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08);gap:8px;flex-wrap:wrap}
.side-head .label{color:var(--call-muted)}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tgl{background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--call-fg);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.tgl[aria-pressed="true"]{background:var(--call-fg);color:var(--call)}
.log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.msg{max-width:92%;display:flex;flex-direction:column;gap:6px}
.msg .bubble{padding:9px 12px;border-radius:14px;line-height:1.45;overflow-wrap:anywhere}
.msg.t{align-self:flex-start}
.msg.t .bubble{background:rgba(255,255,255,.07);border-top-left-radius:4px}
.msg.u{align-self:flex-end;align-items:flex-end}
.msg.u .bubble{background:#2a4f58;border-top-right-radius:4px}
.msg .who{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--call-muted)}
.fix{background:#2b1f1d;border:1px solid rgba(255,138,122,.3);border-radius:10px;padding:8px 10px;font-size:13.5px;display:flex;flex-direction:column;gap:3px;width:100%;text-align:left}
.fix del{color:#ff9d90;text-decoration-thickness:1.5px}
.fix ins{color:#8be3b0;text-decoration:none;font-weight:600}
.fix p{margin:0;color:#d8cfcc}
.fix.ok{background:#1b2e24;border-color:rgba(139,227,176,.3)}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{font-size:12px;background:rgba(240,192,90,.12);color:#f3d48f;border-radius:6px;padding:2px 7px}
.typing{color:var(--call-muted);font-size:13px;font-style:italic}
.partial{align-self:flex-end;color:var(--call-muted);font-style:italic;font-size:14px;max-width:92%}
.compose{display:flex;gap:8px;padding:10px;border-top:1px solid rgba(255,255,255,.08)}
.compose input{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:10px 14px;color:var(--call-fg)}
.compose button{border-radius:999px;border:none;background:var(--call-fg);color:var(--call);padding:0 16px;font-weight:600;cursor:pointer}
.controls{display:flex;justify-content:center;align-items:center;gap:14px;padding:14px 16px 16px;flex-wrap:wrap}
.cbtn{width:56px;height:56px;border-radius:50%;border:none;background:#2a3639;color:var(--call-fg);display:grid;place-items:center;cursor:pointer;transition:transform .12s,background .15s}
.cbtn:hover{background:#34444a}
.cbtn:active{transform:scale(.94)}
.cbtn svg{width:24px;height:24px}
.cbtn.mic{width:68px;height:68px;background:#e8ecea;color:#121a1d}
.cbtn.mic.live{background:#58d68d}
.cbtn.end{background:#d64545;color:#fff;width:64px}
.cbtn.end:hover{background:#e25555}
.cbtn:disabled{opacity:.4;cursor:default}
.cbtn-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--call-muted)}

/* ---------- report ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,14,16,.6);z-index:30;display:grid;place-items:center;padding:16px;overflow-y:auto}
.report{background:var(--surface);color:var(--fg);border-radius:20px;max-width:720px;width:100%;padding:26px;display:flex;flex-direction:column;gap:16px;max-height:calc(100% - 16px);overflow-y:auto}
.report h2{font-size:28px}
.report ul{margin:0;padding-left:20px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.notice{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:14px}
/* skills, sound check, flashcards, analysis states */
.skills{display:flex;flex-direction:column;gap:8px}
.skill{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:14px}
.skill .bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.skill .bar i{display:block;height:100%;background:var(--sky)}
.skill b{font:500 12px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.lvl-note{font-size:13px;color:var(--muted);margin:0}
.check{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.check .status{font-size:13px;color:var(--muted);flex-basis:100%}
.check .status.ok{color:var(--ok)}
.check .status.bad{color:var(--err)}
.btn.sm{padding:6px 12px;font-size:13px}
.vocab-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.box-dots{display:inline-flex;gap:2px;margin-left:4px;vertical-align:middle}
.box-dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.box-dots i.on{background:var(--ok)}
.flash{background:var(--surface);color:var(--fg);border-radius:20px;max-width:520px;width:100%;padding:24px;display:flex;flex-direction:column;gap:14px}
.flash .prompt{font:700 clamp(22px,4vw,30px)/1.2 var(--f-display);text-wrap:balance}
.flash input{font-size:18px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.flash .res{border-radius:10px;padding:10px 12px}
.flash .res.good{background:var(--ok-bg)}
.flash .res.bad{background:var(--err-bg)}
.flash .res.mid{background:var(--surface-2)}
.flash-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.checking{font-size:12px;color:var(--call-muted);font-style:italic}
.fix.better{background:#2b261a;border-color:rgba(240,192,90,.3)}
.fix.better ins{color:#f3d48f}
.fix .k{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--call-muted)}
.gap-chip{font-size:12px;background:rgba(108,182,201,.15);color:#a8d8e6;border-radius:6px;padding:2px 7px}
.retry{align-self:flex-start;background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--call-fg);border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer}
.bubble .w{cursor:pointer;border-radius:3px;transition:background .1s}
.bubble .w:hover,.bubble .w:focus-visible{background:rgba(255,255,255,.14);outline:none}
.bubble .w.sel{background:rgba(240,192,90,.28)}
.def{background:#1f2a2e;border:1px solid rgba(240,192,90,.35);border-radius:10px;padding:9px 11px;font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.def b{font-family:var(--f-display);font-size:15px;color:#f3d48f}
.def p{margin:0;color:#dfe6e3}
.def .ex{color:var(--call-muted);font-style:italic}
.def .row button{background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--call-fg);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.mic-help{background:var(--err-bg);color:var(--fg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.mic-help p{margin:0}
.mic-help .btn{align-self:flex-start;margin-top:4px}
.log .mic-help{background:#2b1f1d;color:#f1e6e3;border:1px solid rgba(255,138,122,.3)}
.log .mic-help .btn{background:#eef2ef;color:#121a1d;border:none}
.heard{margin:0;font-size:15px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.type-pill{font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:#f0c05a;color:#121a1d}
.type-pill.role{background:#8fd0e0}.type-pill.debate{background:#ff9d90}.type-pill.listen{background:#b9a6f0}.type-pill.grammar{background:#9fe0b4}.type-pill.vocab{background:#f3d48f}.type-pill.review{background:#d8d2c6}.type-pill.story{background:#f2b8d0}.type-pill.idioms{background:#c9e27a}
.type-pill.light{font-size:10px;padding:4px 6px}
.dur{font:500 12px var(--f-mono);color:var(--call-muted)}
.linkbtn{background:none;border:none;color:var(--call-fg);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px;padding:4px 0;opacity:.85}
.custom{display:flex;flex-direction:column;gap:8px;border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
.custom .label{color:var(--call-muted)}
.custom-input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 14px;color:var(--call-fg)}
.prog{display:flex;flex-direction:column}
.prog-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.prog-row:first-child{border-top:none}
.prog-n{font:500 12px var(--f-mono);color:var(--muted)}
.prog-topic{font-weight:600;overflow-wrap:anywhere}
.prog-actions{display:flex;gap:6px}
.time-track{height:3px;background:rgba(255,255,255,.08);margin:0 max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-radius:2px;overflow:hidden}
.time-track i{display:block;height:100%;width:0;background:#58d68d;transition:width 1s linear}
.rec.over{color:#f0c05a}
.timeup{background:#2b261a;border:1px solid rgba(240,192,90,.35);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.timeup p{margin:0;color:#e8dfc8}
.life{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.life-tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;cursor:pointer;min-width:0}
.life-tile:hover{background:var(--surface-2)}
.life-name{font-weight:600;font-size:13.5px;line-height:1.25}
.life-meta{font-size:12px;color:var(--muted)}
.life-tile.new{border-style:dashed}
.life-tile.started{border-color:var(--sky);box-shadow:inset 3px 0 0 var(--sky)}
.life-tile.pro .life-name{color:var(--sky)}
.goal{width:100%;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
.type-pill.interview{background:#ffb27a}
.life-tile.solid{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok);background:var(--ok-bg)}
[hidden]{display:none!important}
.mini-select{background:transparent;color:var(--call-fg);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px 8px;font-size:12px;max-width:100%}
.mini-select option{color:#121a1d}
.cbtn.send{width:auto;padding:0 18px;border-radius:999px;background:#58d68d;color:#121a1d;font-weight:700;height:48px}
.cbtn.mic.muted-mic{background:#2a3639;color:var(--call-fg);outline:2px dashed rgba(255,255,255,.3)}
.mic-wrap span{max-width:150px;text-align:center}
.flash.wide{max-width:680px;max-height:calc(100% - 16px);overflow-y:auto}
.chip.light{border-color:var(--line);color:var(--fg)}
.chip.light[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.workshop-list{display:flex;flex-direction:column}
.ex input[type=text],.ex input:not([type]){background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.voice-select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
.diag{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:#f0c05a;color:#121a1d;border-radius:6px;padding:3px 7px}
@media (max-width:820px){
  .captions{display:none}
  .controls{gap:8px;padding:10px 8px 12px;flex-wrap:nowrap}
  .cbtn{width:46px;height:46px}.cbtn.mic{width:58px;height:58px}.cbtn.end{width:52px}
  .cbtn-wrap{font-size:10px;max-width:64px;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);

  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));

}

/* =========================================================
   Storage: private per-viewer documents in db, localStorage fallback
   ========================================================= */
const Store = {
  uidVal: null,
  async init() {
    if (CAP.db && CAP.user) { try { this.uidVal = await CAP.user.id(); } catch { this.uidVal = null; } }
  },
  get online() { return !!(CAP.db && this.uidVal); },
  ref(k) { return CAP.db.collection("data/users/" + this.uidVal).doc(k); },
  async get(k) {
    if (this.online) {
      try {
        const snap = await Promise.race([this.ref(k).get(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
        if (snap.exists) return JSON.parse(JSON.stringify(snap.data()));
      } catch (e) { console.warn("db get", e); }
    }
    try { return JSON.parse(localStorage.getItem("elena:" + k)); } catch { return null; }
  },
  queue: {},
  async set(k, v) {
    const copy = JSON.parse(JSON.stringify(v));
    try { localStorage.setItem("elena:" + k, JSON.stringify(copy)); } catch {}
    if (!this.online) return;
    const q = this.queue[k] || (this.queue[k] = { busy: false, next: null });
    q.next = copy;
    if (q.busy) return;
    q.busy = true;
    while (q.next) {
      const val = q.next; q.next = null;
      try { await this.ref(k).set(val); }
      catch (e) { console.warn("db set", e); toast("Sauvegarde en ligne impossible. Tes progrès sont gardés sur cet appareil."); }
    }
    q.busy = false;
  }

function newLang(declared) {

function migrate(d, declared) {
  if (!d) return newLang(declared);

/* ---------- vocabulary bank (spaced repetition) ---------- */
function vocabKey(w) { return str(w).toLowerCase().replace(/^(el|la|los|las|un|una|the|a|an|to)\s+/, ""); }
function addVocab(l, items, src, dom) {
  const d = S.data[l]; let added = 0;
  for (const it of arr(items)) {
    const w = str(it.word || it.w), m = str(it.meaning || it.m);
    if (!w || w.length > 80) continue;
    const ex = d.vocab.find(v => vocabKey(v.w) === vocabKey(w));
    if (ex) { if (src === "lacune") { ex.box = 0; ex.due = now(); ex.src = "lacune"; } if (!ex.ex && it.example) ex.ex = str(it.example); if (!ex.dom && dom) ex.dom = dom; continue; }
    d.vocab.push({ w, m, ex: str(it.example), box: 0, due: now(), ok: 0, ko: 0, src, added: today(), ...(dom ? { dom } : {}) });
    added++;
  }
  // keep the bank bounded: drop the best-known words first
  if (d.vocab.length > 400) { d.vocab.sort((a, b) => a.box - b.box); d.vocab.length = 400; }
  return added;
}
function dueWords(l, n) {
  const t = now();
  return S.data[l].vocab.filter(v => v.due <= t).sort((a, b) => (a.src === "lacune" ? -1 : 0) - (b.src === "lacune" ? -1 : 0) || a.box - b.box || a.due - b.due).slice(0, n);
}
function grade(v, result) {
  if (result === "good") { v.box = Math.min(6, v.box + 1); v.ok++; }
  else if (result === "bad") { v.box = 0; v.ko++; }
  v.due = now() + BOX_DAYS[v.box] * 864e5;
}
function markUsed(l, words) {
  const d = S.data[l];
  for (const w of arr(words)) {
    const v = d.vocab.find(x => vocabKey(x.w) === vocabKey(w));
    if (v) grade(v, "good");
  }
}

/* =========================================================
   Microphone helper: language fallback + plain-French diagnosis
   ========================================================= */
const Mic = {
  langMode: (() => { try { return JSON.parse(localStorage.getItem("elena:micLang")) || {}; } catch { return {}; } })(),
  opts(l) { const m = this.langMode[l] || 0; return m === 0 ? { language: LANGS[l].stt } : m === 1 ? { language: l } : undefined; },
  bump(l) {
    const m = this.langMode[l] || 0; if (m >= 2) return false;
    this.langMode[l] = m + 1; try { localStorage.setItem("elena:micLang", JSON.stringify(this.langMode)); } catch {}
    return true;
  },
  // must be called synchronously inside the click / key handler
  start(l) { return CAP.dictation.start(this.opts(l)); },
  async permState() { try { return CAP.permissions ? await CAP.permissions.state("dictation") : null; } catch { return null; } },
  // returns a DOM block explaining the problem and how to fix it
  help(code, l) {
    const box = h("div", { class: "mic-help", role: "alert" });
    const unblock = () => h("button", { class: "btn sm", type: "button", text: "Débloquer le micro", onclick: async () => {
      try { await CAP.permissions.manage(); toast("Appuie à nouveau sur le micro."); }
      catch { toast("Ouvre le menu Permissions de la page (en haut) et active la dictée."); }
    } });
    const P = t => h("p", { text: t });
    if (!CAP.dictation) box.append(
      h("strong", { text: "Le micro n'est pas proposé dans cette fenêtre." }),
      P("Claude ne donne le micro aux pages que dans Google Chrome, Edge, Brave ou Arc sur ordinateur (sur claude.ai), ou dans la fenêtre principale de l'app Claude pour ordinateur, mise à jour."),
      P("Il ne marche pas dans Safari, Firefox ni l'app Claude sur téléphone. Ouvre ce lien dans Chrome sur ton ordi : le micro apparaîtra."));
    else if (code === "not_granted") box.append(
      h("strong", { text: "Le micro est bloqué." }),
      P("1. Clique sur « Débloquer le micro » et active la dictée pour cette page."),
      P("2. Si ça ne suffit pas : clique sur le cadenas à gauche de l'adresse claude.ai, mets Microphone sur « Autoriser », puis recharge la page."),
      P("3. Sur Mac : Réglages Système → Confidentialité et sécurité → Microphone → coche ton navigateur. Sur Windows : Paramètres → Confidentialité → Microphone → autorise les applis de bureau."),
      CAP.permissions ? unblock() : null);
    else if (code === "dismissed") box.append(h("strong", { text: "Tu as fermé la demande d'autorisation." }), P("Appuie à nouveau sur le micro et choisis « Autoriser »."));
    else if (code === "unavailable") { const bumped = Mic.bump(l); box.append(h("strong", { text: bumped ? "J'ai ajusté le réglage de langue du micro." : "La dictée n'est pas disponible pour ton compte en ce moment." }),
      P(bumped ? "Appuie encore une fois sur le micro." : "Tu peux écrire tes réponses en attendant.")); }
    else if (code === "upstream_error") box.append(h("strong", { text: "Le micro ne répond pas." }),
      P("Ferme les applis qui peuvent l'utiliser (Zoom, Teams, Discord, FaceTime…), vérifie le micro choisi par ton ordinateur, puis réessaie."));
    else if (code === "rate_limited") box.append(h("strong", { text: "Micro occupé." }), P("Attends quelques secondes et réessaie."));
    else if (code === "no_sound") box.append(h("strong", { text: "Je n'ai rien entendu." }),
      P("Parle plus près de l'ordinateur. Si rien ne s'affiche quand tu parles, vérifie que le bon micro est choisi (Réglages Son de ton ordinateur) et qu'il n'est pas coupé."));
    else box.append(h("strong", { text: "Le micro n'a pas démarré." }), P("Réessaie. Si ça recommence, recharge la page."));
    return box;
  }
};

/* ---------- sound & mic check ---------- */
function soundCheckPanel(l) {
  const status = h("p", { class: "status", text: `${Voice.voiceLabel(l)} · ${CAP.dictation ? "micro disponible" : "micro non proposé dans cette fenêtre"}` });
  const heard = h("p", { class: "heard", hidden: true });
  const helpSlot = h("div");
  const testVoice = h("button", { class: "btn sm", text: `Tester la voix ${deTn(l)}`, onclick: async () => {
    status.className = "status"; status.textContent = `Lecture en cours… tu dois entendre ${tn(l)}.`;
    const parts = l === "es" ? [{ lang: "es", text: `¡Hola ${S.profile.name}! Soy Elena. ¿Me oyes bien? Si me oyes, todo está listo.` }]
                             : [{ lang: "en", text: `Hiya ${S.profile.name}, I'm James. Can you hear me alright? Brilliant, then we're all set.` }];
    await Voice.speak(parts, l);
    status.className = "status " + (Voice.engine === "none" ? "bad" : "ok");
    status.textContent = Voice.engine === "none" ? "Aucune voix disponible dans ce navigateur : tu liras les sous-titres." : `${Voice.voiceLabel(l)}. Si tu n'as rien entendu, monte le volume et vérifie que l'onglet n'est pas en sourdine.`;
  } });
  const testMic = h("button", { class: "btn sm primary", text: "Tester mon micro" });
  let offs = [], timer = 0, txt = [];
  const finish = () => { offs.forEach(f => { try { f(); } catch {} }); offs = []; clearTimeout(timer); testMic.textContent = "Tester mon micro"; };
  const fail = code => { finish(); helpSlot.replaceChildren(Mic.help(code, l)); status.className = "status bad"; status.textContent = "Micro : pas encore prêt (voir ci-dessous)."; };
  testMic.onclick = () => {
    const dd = CAP.dictation;
    helpSlot.replaceChildren();
    if (!dd) { fail(null); return; }
    if (dd.active()) { dd.stop().catch(() => {}); return; }
    Voice.stop(); txt = [];
    heard.hidden = false; heard.textContent = l === "es" ? "Parle maintenant, par exemple : « Hola, me llamo… »" : "Parle maintenant, par exemple : “Hello, my name is…”";
    offs = [
      dd.onPartial(({ text }) => { heard.textContent = "J'entends : " + [...txt, text].join(" "); }),
      dd.onFinal(({ text }) => { if (str(text)) txt.push(str(text)); heard.textContent = "J'entends : " + txt.join(" "); clearTimeout(timer); timer = setTimeout(() => dd.stop().catch(() => {}), 1500); }),
      dd.onState(({ state, reason }) => {
        if (state === "listening") testMic.textContent = "Arrêter le test";
        if (state === "idle") {
          if (txt.length) { finish(); helpSlot.replaceChildren(); status.className = "status ok"; status.textContent = `Micro OK : ${tn(l)} t'entend bien.`; }
          else if (["not_granted", "dismissed", "unavailable", "upstream_error", "rate_limited"].includes(reason)) fail(reason);
          else fail("no_sound");
        }
      })
    ];
    Mic.start(l).catch(e => { if (e?.code !== "stopped") fail(e?.code); });
    timer = setTimeout(() => { if (dd.active()) dd.stop().catch(() => {}); }, 9000);
  };
  // show a blocked microphone right away, without asking anything
  Mic.permState().then(st => { if (st === "denied") { helpSlot.replaceChildren(Mic.help("not_granted", l)); status.className = "status bad"; status.textContent = "Micro bloqué pour cette page."; } });
  if (!CAP.dictation) helpSlot.append(Mic.help(null, l));
  const vs = Voice.voicesFor(l);
  const voiceSel = vs.length ? h("select", { id: "voice-" + l, class: "voice-select", "aria-label": "Voix du prof" },
    h("option", { value: "", text: "Voix automatique (la meilleure trouvée)" }),
    vs.map(v => h("option", { value: v.name, selected: S.profile.voices?.[l] === v.name, text: `${v.name} · ${v.lang}${v.localService ? "" : " (en ligne)"}` }))) : null;
  if (voiceSel) voiceSel.onchange = () => {
    S.profile.voices = { ...(S.profile.voices || {}), [l]: voiceSel.value || undefined };
    delete Voice._lock[l]; saveProfile(); testVoice.click();
  };
  return h("section", { class: "panel" },
    h("h2", { text: "Son et micro" }),
    voiceSel ? h("label", { class: "field", style: "gap:4px" }, h("span", { class: "label", text: `Voix ${deTn(l)}` }), voiceSel) : null,
    h("div", { class: "check" }, testVoice, testMic, status), heard, helpSlot);
}

const norm = s => str(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[¿?¡!.,;:"'()«»]/g, "").replace(/^(el|la|los|las|un|una|the|a|an|to)\s+/, "").replace(/\s+/g, " ").trim();
const strict = s => str(s).toLowerCase().replace(/[¿?¡!.,;:"'()«»]/g, "").replace(/^(el|la|los|las|un|una|the|a|an|to)\s+/, "").replace(/\s+/g, " ").trim();
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
function blankOut(ex, w) {
  const core = vocabKey(w);
  const re = new RegExp(core.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig");
  return re.test(ex) ? ex.replace(re, "_____") : ex;
}

/* Written vocabulary workshop: exercises on a real-life domain or on your own words, corrected instantly */
function workshop(l) {
  const d = S.data[l];
  const card = h("div", { class: "flash wide", role: "dialog", "aria-label": "Atelier de vocabulaire" });
  const ov = h("div", { class: "overlay" }, card);

  const choose = () => {

      h("span", { class: "label", text: "Sur quoi ?" }),

        doms.map(x => chip(x.id, x.name, pickDom === x.id, v => pickDom = v))),
      h("span", { class: "label", text: "Combien d'exercices ?" }),
      h("div", { class: "chips" }, [6, 8, 12].map(n => chip(n, n + " exercices", count === n, v => count = v))),
      h("button", { class: "btn primary", disabled: !CAP.sample, onclick: generate, text: "Créer mes exercices" }),
      !CAP.sample ? h("p", { class: "muted", text: "Ouvre la page dans Claude pour générer des exercices." }) : null);
  };
  async function generate() {
    card.replaceChildren(h("div", { class: "row" }, h("div", { class: "spinner" }), h("p", { style: "margin:0", text: "Préparation des exercices…" })));
    const L = LANGS[l].name.toUpperCase(), dom = DOMAIN_BY_ID[pickDom];
    const mine = d.vocab.slice().sort((a, b) => a.box - b.box).slice(0, 30).map(v => v.w).join(", ");
    try {
      const r = await askJSON(`Crée ${count} exercices ÉCRITS de vocabulaire de ${LANGS[l].name.toLowerCase()} pour un francophone de niveau ${d.level}${l === "en" ? " (anglais britannique)" : " (espagnol d'Espagne)"}.
${l === "en" ? `Objectif professionnel de l'apprenant : ${goalEn()}.\n` : ""}${dom ? `Domaine : ${dom.name}. Choisis les mots les plus utiles au quotidien dans ce domaine, adaptés à son niveau.` : `Travaille ces mots de sa banque (en priorité les premiers) : ${mine}.`}
Varie les types : "fill" (phrase avec ___ à compléter par le mot), "define" (définition simple → trouver le mot), "synonym" (donner un synonyme ou le contraire), "qcm" (3 "options", une seule correcte), "use" (écrire une phrase personnelle avec le mot donné).
Toutes les consignes, définitions et indices EN ${L} simple : JAMAIS de français, jamais de traduction.
"expected" = réponse attendue, variantes séparées par " / " ("" pour "use"). "word" = le mot travaillé (avec article pour un nom), "meaning" = définition très simple EN ${L}, "example" = phrase d'exemple courte.
Réponds uniquement en JSON : {"exercises":[{"type":"fill","prompt":"","expected":"","options":[],"hint":"","word":"","meaning":"","example":""}]}`, { effort: "low" });
      const list = arr(r.exercises).filter(e => str(e?.prompt)).slice(0, 12).map(e => ({
        type: ["fill", "define", "synonym", "qcm", "use"].includes(e.type) ? e.type : "fill",
        prompt: str(e.prompt), expected: str(e.expected), hint: str(e.hint),
        options: arr(e.options).map(str).filter(Boolean).length >= 2 ? arr(e.options).map(str).filter(Boolean) : undefined,
        word: str(e.word), meaning: str(e.meaning), example: str(e.example)
      })).map(e => (e.type === "qcm" && !e.options ? { ...e, type: "fill" } : e));
      if (!list.length) throw { code: "invalid_json" };
      run(list, dom);
    } catch (e) {
      card.replaceChildren(h("h2", { text: "Exercices indisponibles" }), h("p", { text: errCopy(e) }),
        h("div", { class: "row" }, h("button", { class: "btn primary", onclick: generate, text: "Réessayer" }), h("button", { class: "btn", onclick: close, text: "Fermer" })));

  function run(list, dom) {
    const score = h("p", { class: "notice", hidden: true });
    const body = h("div", { class: "workshop-list" });
    const refresh = () => {
      const doneN = list.filter(isChecked).length, good = list.filter(e => e.correct).length;
      prog.textContent = `${doneN}/${list.length} corrigés · ${good} juste${good > 1 ? "s" : ""}`;
      if (doneN === list.length) { score.hidden = false; score.textContent = `Terminé : ${good}/${list.length}. ${good === list.length ? "Parfait !" : "Les mots ratés sont dans ta banque et reviendront en cartes."}`; }
    };
    const prog = h("span", { class: "label" });
    list.forEach((ex, i) => {
      const blockHolder = h("div");
      const render = () => blockHolder.replaceChildren(exerciseBlock(l, ex, i, {
        idBase: `ws-${i}`,
        words: ex.word ? [{ word: ex.word, meaning: ex.meaning, example: ex.example }] : [],
        onChecked: () => {
          if (ex.correct && ex.word) markUsed(l, [ex.word]);
          if (!ex.correct && ex.word && dom) { const v = d.vocab.find(x => vocabKey(x.w) === vocabKey(ex.word)); if (v && !v.dom) v.dom = dom.id; }

  };

  const idleLabel = () => C.listening ? (micMode() === "call" ? "Appel en cours, parle librement" : "Je t'écoute") : (micMode() === "call" ? "Ouvrir le micro" : "Appuie et parle");
  const clearSilence = () => { clearTimeout(silenceT); clearInterval(tickT); silenceT = 0; if (C.open) label(idleLabel()); };

    const said = pendingText();
    if (partial) skipFinal = norm(partial);
    C.finals = []; partial = ""; waitPartial = 0; paint();

  };
  const armSilence = () => {
    clearSilence();
    const ms = patience(); if (!ms) return;              // manual: only the Send button sends
    const until = now() + ms;

    tick(); tickT = setInterval(tick, 250);

    d.onPartial(({ text }) => {

      if (deaf(text)) { partial = ""; paint(); return; }    // ignore the teacher's own voice

    }),
    d.onFinal(({ text }) => {

      const t = str(text);

      if (!t || deaf(t)) { paint(); return; }
      if (skipFinal && (norm(t) === skipFinal || skipFinal.startsWith(norm(t)) || norm(t).startsWith(skipFinal))) { skipFinal = ""; paint(); return; }
      skipFinal = "";

    }),
    d.onState(({ state, reason }) => {

      btn.classList.toggle("muted-mic", !live && micMode() === "call");

      else if (state === "listening") { label(idleLabel()); if (micMode() === "ptt") { clearTimeout(noSpeechT); noSpeechT = setTimeout(() => { if (d.active() && !pendingText()) { weStopped = true; d.stop().catch(() => {}); } }, 15000); } }

        const said = pendingText(); C.finals = []; partial = ""; paint();
        if (said) userSays(said, true);
        const mine = weStopped; weStopped = false;
        label(idleLabel());
        if (["not_granted", "dismissed", "unavailable", "upstream_error", "rate_limited"].includes(reason)) showMicHelp(reason);
        else if (!mine && micMode() === "call" && reason !== "stopped") { label("Micro coupé : appuie pour reprendre"); toast(reason === "hidden" ? "Le micro s'est coupé car la page était cachée. Appuie sur le micro pour reprendre." : "Le micro s'est coupé. Appuie dessus pour reprendre l'appel."); }
        else if (!said && micMode() === "ptt" && !mine) showMicHelp("no_sound");
      }
    })
  ];
  btn.onclick = () => {
    if (C.listening) {
      if (micMode() === "call") { weStopped = true; flush(); d.stop().catch(() => {}); toast("Micro coupé. Appuie à nouveau pour reprendre."); }
      else flush();
      return;
    }
    Voice.stop();
    C.finals = []; partial = ""; skipFinal = "";
    document.querySelectorAll(".log .mic-help").forEach(x => x.remove());
    Mic.start(S.cur).catch(e => { if (e?.code !== "stopped") showMicHelp(e?.code); });
  };

}

/* Deep correction + gap detection, runs in parallel with Elena's reply */
async function analyse(content, bubble) {
  const l = S.cur;
  const teacherLine = C.lastTeacherText;
  const wait = h("span", { class: "checking", text: `${tn(S.cur)} vérifie ta phrase…` });
  bubble.append(wait); scrollLog();
  let r;
  try { r = await askJSON(analysisPrompt(l, teacherLine, content), { effort: "low" }); }
  catch (e) {
    if (!C.open) return;
    wait.replaceWith(h("button", { class: "retry", onclick: ev => { ev.currentTarget.remove(); analyse(content, bubble); }, text: "Correction indisponible · réessayer" }));
    return;
  }
  if (!C.open) return;
  wait.remove();
  const fixes = arr(r.corrections).filter(c => str(c?.original) && str(c?.corrected) && norm(c.original) !== norm(c.corrected));
  const better = arr(r.better).filter(b => str(b?.said) && str(b?.better)).slice(0, 2);
  const gaps = arr(r.vocab_gaps).filter(g => str(g?.word)).slice(0, 3);
  fixes.forEach(f => {
    bubble.append(h("div", { class: "fix" },
      h("div", null, h("del", { text: str(f.original) }), "  →  ", h("ins", { text: str(f.corrected) })),
      str(f.explanation) ? h("p", { text: str(f.explanation) }) : null));
    C.errors.push({ original: str(f.original), corrected: str(f.corrected), explanation: str(f.explanation), category: str(f.category) || "divers" });
  });
  better.forEach(b => {
    bubble.append(h("div", { class: "fix better" }, h("span", { class: "k", text: "Plus naturel" }),
      h("div", null, h("del", { text: str(b.said) }), "  →  ", h("ins", { text: str(b.better) })),
      str(b.why) ? h("p", { text: str(b.why) }) : null));
    C.betters.push({ said: str(b.said), better: str(b.better) });
  });
  if (!fixes.length && !better.length) bubble.append(h("div", { class: "fix ok" }, h("p", { text: l === "es" ? "¡Perfecto! Aucune erreur." : "Spot on. No mistakes." })));
  if (gaps.length) {
    const n = addVocab(l, gaps, "lacune", C.spec?.domain);
    C.gaps.push(...gaps.map(g => ({ word: str(g.word), meaning: str(g.meaning) })));
    bubble.append(h("div", { class: "words" }, gaps.map(g => h("span", { class: "gap-chip", text: `+ ${str(g.word)} : ${str(g.meaning)}` }))));
    if (n) saveLang(l);
  }
  arr(r.used_targets).forEach(w => C.used.add(str(w)));
  const lvl = LEVELS.includes(r.level) ? r.level : null;
  C.analyses.push({ errors: fixes.length, level: lvl });
  // live level = median of observed signals (needs 3+ to move away from the stored level)
  const sig = C.analyses.map(a => a.level).filter(Boolean).map(x => LEVELS.indexOf(x)).sort((a, b) => a - b);
  if (sig.length >= 3) {
    C.liveLevel = LEVELS[sig[Math.floor(sig.length / 2)]];
    const el = $("#live-level"); if (el) el.textContent = "Niveau observé " + C.liveLevel + " · ";
  }
  scrollLog();
}

async function teacherTurn(content, userBubble) {
  const l = S.cur;
  if (!C.open) return;
  C.busy = true;
  Avatar.set({ thinking: true }); Voice.stateCb?.(false);
  const typing = h("div", { class: "typing", text: `${tn(l)} réfléchit…` });
  $("#log")?.append(typing); scrollLog();
  C.turns.push({ role: "user", content });
  const recent = C.turns.slice(-24);
  while (recent.length && recent[0].role !== "user") recent.shift();
  const input = [{ role: "user", content: convRules(l) + "\n\n---\n\n" + recent[0].content }, ...recent.slice(1)];
  input[input.length - 1] = { role: "user", content: input.at(-1).content + "\n\n(Réponds avec l'objet JSON demandé.)" };
  const ctl = C.ctl = new AbortController();
  try {
    const r = await askJSON(input, { modelTier: "quick", signal: ctl.signal });
    if (!C.open) return;
    typing.remove();
    const rawSay = arr(r.say).filter(p => str(p?.text));
    const noFr = rawSay.filter(p => p?.lang !== "fr");   // immersion: drop any French part the model slips in
    let say = (noFr.length ? noFr : rawSay).map(p => ({ lang: l, text: str(p.text) }));
    if (!say.length && str(r.reply)) say = [{ lang: l, text: str(r.reply) }];
    if (!say.length) throw { code: "invalid_json" };
    const text = say.map(p => p.text).join(" ");
    const words = arr(r.new_words).filter(w => str(w?.word)).slice(0, 4);
    C.turns.push({ role: "assistant", content: text });
    C.lastSay = say; C.lastTeacherText = text;
    if (r.done === true && !C.timeUp && (now() - C.start) / 60000 >= C.spec.minutes * .8) showTimeUp();
    words.forEach(w => C.words.push({ word: str(w.word), meaning: str(w.meaning) }));
    C.log.push({ who: "teacher", text });
    const msg = h("div", { class: "msg t" }, h("span", { class: "who", text: tn(l) }), wordBubble(text, l),
      words.length ? h("div", { class: "words" }, words.map(w => h("span", { text: `${str(w.word)} : ${str(w.meaning)}` }))) : null);
    $("#log")?.append(msg); scrollLog();
    const cap = $("#captions");
    if (cap) cap.replaceChildren(h("span", { text }));
    C.busy = false;
    Avatar.set({ thinking: false });
    flushPending();
    if (!C.busy && (!C.listening || micMode() === "call")) await Voice.speak(say, l);
  } catch (e) {
    typing.remove();
    C.turns.pop();
    C.busy = false; Avatar.set({ thinking: false }); Voice.stateCb?.(false);
    if (e?.code === "cancelled" || !C.open) return;
    const retry = h("button", { class: "retry", text: "Réessayer", onclick: () => { errBox.remove(); if (!C.busy) teacherTurn(content, userBubble); } });
    const errBox = h("div", { style: "display:flex;flex-direction:column;gap:6px" }, h("div", { class: "typing", text: errCopy(e) }), e?.code !== "not_granted" ? retry : null);
    $("#log")?.append(errBox); scrollLog();
    if (e?.code === "not_granted") { const m = $("#mic"); if (m) m.disabled = true; }
    else flushPending();
  }
}

/* Tap a word Elena said: monolingual explanation, never a translation */
const DEF_CACHE = new Map();
function wordBubble(text, l) {
  const b = h("div", { class: "bubble" });
  for (const part of text.split(/([\p{L}\p{M}'’-]+)/u)) {
    if (!part) continue;
    if (/^[\p{L}\p{M}'’-]+$/u.test(part) && /\p{L}/u.test(part)) {
      const sp = h("span", { class: "w", tabindex: "0", role: "button", text: part });
      const go = () => defineWord(l, part, text, sp);
      sp.addEventListener("click", go);
      sp.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
      b.append(sp);
    } else b.append(document.createTextNode(part));
  }
  return b;
}
async function defineWord(l, word, sentence, span) {

  document.querySelectorAll(".bubble .w.sel").forEach(x => x.classList.remove("sel"));
  span.classList.add("sel");
  const box = h("div", { class: "def", "aria-live": "polite" }, h("b", { text: word }), h("p", { class: "ex", text: "…" }));
  msg.append(box); scrollLog();
  const key = l + "|" + word.toLowerCase() + "|" + sentence;
  const L = LANGS[l].name.toUpperCase();
  try {
    let r = DEF_CACHE.get(key);
    if (!r) {
      r = await askJSON(`Un apprenant de ${LANGS[l].name.toLowerCase()} (niveau ${C.liveLevel || S.data[l].level}, francophone) ne comprend pas le mot « ${word} » dans cette phrase : « ${sentence} ».
Explique-le UNIQUEMENT EN ${L}, avec des mots plus simples que le mot lui-même (synonyme, définition courte, contraire si utile). INTERDIT : le français et toute traduction.
Réponds uniquement en JSON : {"lemma":"forme de dictionnaire (avec article pour un nom)","definition":"définition simple en ${LANGS[l].name.toLowerCase()}","example":"autre phrase d'exemple très simple"}`, { modelTier: "quick" });
      DEF_CACHE.set(key, r);

    if (!box.isConnected) return;

    const inBank = S.data[l].vocab.some(v => vocabKey(v.w) === vocabKey(lemma));

    add.onclick = () => { addVocab(l, [{ word: lemma, meaning: def, example: ex }], "lacune", C.spec?.domain); saveLang(l); add.textContent = l === "es" ? "Añadida ✓" : "Added ✓"; add.disabled = true; };
    box.replaceChildren(h("b", { text: lemma }), def ? h("p", { text: def }) : null, ex ? h("p", { class: "ex", text: ex }) : null,
      h("div", { class: "row" }, h("button", { type: "button", onclick: () => { if (!C.listening) Voice.speak([{ lang: l, text: lemma + ". " + ex }], l); }, text: l === "es" ? "Escuchar" : "Listen" }), add,
        h("button", { type: "button", onclick: () => { box.remove(); span.classList.remove("sel"); }, text: "✕", "aria-label": "Fermer" })));
    scrollLog();
  } catch (e) {

}

7. "strengths" : 0 à 3 points forts précis.
8. "vocab_gaps" : 0 à 6 mots ou expressions supplémentaires qu'il devrait apprendre vu ce qu'il a voulu dire (avec article pour les noms ; "meaning" = définition simple EN ${LANGS[l].name.toUpperCase()}, jamais de traduction ; exemple court).
9. "homework" : 6 à 8 exercices CIBLÉS : la moitié sur ses lacunes les plus fréquentes, au moins 2 sur le vocabulaire (mots qui lui ont manqué et mots à réviser), et 1 production écrite ("write") de ${isBeginner ? "2-3 phrases simples" : "80-120 mots"} qui oblige à réemployer ces mots. Types : "fill" (phrase à trous ___), "answer" (répondre à une question avec une phrase complète), "rephrase" (reformuler une phrase avec un mot ou une structure imposée), "qcm" (3 "options"), "write". AUCUNE traduction et AUCUN français : toutes les consignes et indices EN ${LANGS[l].name.toUpperCase()}, simples. "expected" = réponse attendue (sauf "write"). Difficulté adaptée au niveau RÉEL.
${l === "en" ? `Pour James : l'objectif est professionnel (${goalEn()}). Au moins 3 exercices sur le vocabulaire professionnel de la recherche clinique et de la santé vu ou manquant aujourd'hui, et la production écrite peut être une réponse d'entretien ou un e-mail professionnel.\n` : `Pour Elena : l'objectif est de converser avec des Espagnols ; privilégie les phrases utiles à l'oral et les réponses à des questions de la vie réelle.\n`}10. "next_goal" : objectif du prochain cours, en une phrase.

Réponds uniquement en JSON :
{"summary":"","message":"","level":"","level_note":"","skills":{"grammaire":0,"vocabulaire":0,"aisance":0,"comprehension":0},"top_mistakes":[{"wrong":"","right":"","rule":""}],"weakness_updates":[{"label":"","delta":1,"note":""}],"strengths":[],"vocab_gaps":[{"word":"","meaning":"","example":""}],"homework":{"title":"","focus":"","exercises":[{"type":"fill","prompt":"","hint":"","expected":""}]},"next_goal":""}`;
  let r;
  try { r = await askJSON(prompt, {}); }
  catch (e) {
    d.sessions.push({ date: today(), minutes, errors: snapshot.errors.length, summary: `${sessionTitle(spec)} (bilan non généré)`, type: spec.type, topic: spec.topic, domain: spec.domain });
    applyWeakness(l, Object.entries(snapshot.errors.reduce((a, x) => (a[x.category] = (a[x.category] || 0) + 1, a), {})).map(([label, delta]) => ({ label, delta })));
    saveLang(l);
    card.replaceChildren(h("h2", { text: "Bilan indisponible" }), h("p", { text: errCopy(e) + " Tes erreurs et les mots qui t'ont manqué ont quand même été enregistrés." }),
      h("button", { class: "btn primary", onclick: () => { ov.remove(); renderLobby(); }, text: "Retour" }));
    return;
  }
  const oldLevel = d.assessed ? d.level : null;
  if (LEVELS.includes(r.level)) { d.level = r.level; d.assessed = true; d.levelNote = str(r.level_note).slice(0, 160); }
  if (r.skills && typeof r.skills === "object") for (const [k] of SKILLS) { const v = Number(r.skills[k]); if (Number.isFinite(v)) d.skills[k] = Math.round(Math.max(0, Math.min(100, v))); }
  applyWeakness(l, r.weakness_updates); addStrengths(l, r.strengths); addVocab(l, r.vocab_gaps, "lacune", spec.domain);
  d.sessions.push({ date: today(), minutes, errors: snapshot.errors.length, summary: str(r.summary) || sessionTitle(spec), next: str(r.next_goal), type: spec.type, topic: spec.topic, domain: spec.domain });
  d.sessions = d.sessions.slice(-30);
  const hwIn = r.homework && typeof r.homework === "object" ? r.homework : null;
  const exs = arr(hwIn?.exercises).filter(ex => str(ex?.prompt)).slice(0, 8);
  if (exs.length) {
    d.homework.push({ id: uid(), date: today(), title: str(hwIn.title) || "Devoirs", focus: str(hwIn.focus), status: "todo",
      exercises: exs.map(ex => {
        const opts = arr(ex.options).map(str).filter(Boolean).slice(0, 5);
        const type = ["fill", "answer", "rephrase", "translate", "qcm", "write"].includes(ex.type) ? ex.type : "answer";
        return { type: type === "qcm" && opts.length < 2 ? "answer" : type, prompt: str(ex.prompt), hint: str(ex.hint), options: opts.length >= 2 ? opts : undefined, expected: str(ex.expected) };
      }) });
    d.homework = d.homework.slice(-12);
  }
  saveLang(l);
  const mistakes = arr(r.top_mistakes).filter(m => str(m?.right));
  card.replaceChildren(
    h("span", { class: "label", text: `Bilan · ${minutes} min · ${snapshot.errors.length} correction${snapshot.errors.length > 1 ? "s" : ""} · ${snapshot.gaps.length + arr(r.vocab_gaps).length} mots ajoutés` }),
    h("h2", { text: l === "es" ? `¡Buen trabajo, ${S.profile.name}!` : `Well done, ${S.profile.name}!` }),
    h("p", { style: "margin:0", text: str(r.message) }),
    d.assessed ? h("p", { class: "notice", text: (oldLevel && oldLevel !== d.level ? `Niveau mesuré : ${oldLevel} → ${d.level}. ` : oldLevel ? `Niveau mesuré : ${d.level}. ` : `Ton vrai niveau : ${d.level} (tu t'estimais ${d.declared}). `) + d.levelNote }) : null,
    mistakes.length ? h("div", null, h("h3", { style: "font-size:16px;margin-bottom:8px", text: "À retenir" }),
      h("div", { style: "display:flex;flex-direction:column;gap:8px" }, mistakes.map(m => h("div", { class: "hw" },
        h("div", null, h("del", { style: "color:var(--err)", text: str(m.wrong) }), "  →  ", h("strong", { style: "color:var(--ok)", text: str(m.right) })),
        str(m.rule) ? h("small", { class: "muted", text: str(m.rule) }) : null)))) : null,
    exs.length ? h("p", { class: "notice", text: `Devoirs : « ${str(hwIn.title) || "Devoirs"} », ${exs.length} exercices sur ${str(hwIn.focus) || "tes lacunes"}.` }) : null,
    str(r.next_goal) ? h("p", { class: "muted", style: "margin:0", text: "Prochain cours : " + str(r.next_goal) }) : null,
    h("button", { class: "btn primary", style: "align-self:flex-start", onclick: () => { ov.remove(); renderLobby(); }, text: "Voir mes devoirs et mon vocabulaire" }));
}

(async function boot() {
  try {
    await initCaps();
    await Store.init();
    await loadAll();
    if (S.profile?.name) {
      S.data.es = migrate(S.data.es, "A0");
      S.data.en = migrate(S.data.en, "C1");
    }
    Voice.init();
    render();
  } catch (e) {
    console.error(e);
    app().replaceChildren(h("div", { class: "onb" }, h("div", { class: "onb-card" }, h("h1", { text: "L'appli n'a pas pu démarrer" }), h("p", { text: "Recharge la page. Si ça continue, ouvre-la depuis claude.ai." }))));
  }
})();
</script>
