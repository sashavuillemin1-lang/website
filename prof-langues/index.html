<title>Clase con Elena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a video-call room. Lobby = carnet de l'élève (progress, devoirs); Call = video tile + live transcript with correction slips. */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --surface-2:#ebe8e1; --line:#d9d4c9;
  --fg:#1d2427; --muted:#5f686b;
  --accent:#c6531f;        /* pimentón */
  --accent-ink:#ffffff;
  --sky:#1f5a6b;           /* english teal */
  --ok:#2f8a5b; --warn:#b5761a; --err:#c23b3b;
  --err-bg:#fbe9e6; --ok-bg:#e5f3ea;
  --call:#121a1d; --call-2:#1b2629; --call-fg:#eef2ef; --call-muted:#94a3a6;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13181a; --surface:#1b2225; --surface-2:#232c30; --line:#334046;
  --fg:#e8ecea; --muted:#9aa6a9; --accent:#ef7a45; --accent-ink:#1a0f09; --sky:#6cb6c9;
  --ok:#5fc78f; --warn:#e3a649; --err:#ff8a7a; --err-bg:#3a2220; --ok-bg:#1d3327;
  --call:#0c1214; --call-2:#162024; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13181a; --surface:#1b2225; --surface-2:#232c30; --line:#334046;
  --fg:#e8ecea; --muted:#9aa6a9; --accent:#ef7a45; --accent-ink:#1a0f09; --sky:#6cb6c9;
  --ok:#5fc78f; --warn:#e3a649; --err:#ff8a7a; --err-bg:#3a2220; --ok-bg:#1d3327;
  --call:#0c1214; --call-2:#162024; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.label{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:600;transition:transform .12s, background .12s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.muted{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;max-width:calc(100% - 32px);font-weight:500}

/* ---------- onboarding ---------- */
.onb{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.onb-card{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:18px}
.onb-card h1{font-size:clamp(28px,5vw,38px)}
.onb-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.onb-row{grid-template-columns:1fr}}

/* ---------- lobby ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}
.brand canvas{width:48px;height:48px;border-radius:50%;background:var(--call)}
.brand h1{font-size:22px}
.hello{font-size:clamp(30px,5vw,48px);margin-bottom:6px}
.lang-tabs{display:flex;gap:8px;flex-wrap:wrap}
.lang-tab{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;min-width:150px;text-align:left}
.lang-tab b{font-family:var(--f-display);font-size:18px}
.lang-tab[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lang-tab.en[aria-pressed="true"]{border-color:var(--sky);box-shadow:inset 0 0 0 1px var(--sky)}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;margin-top:20px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:20px}
.join{background:var(--call);color:var(--call-fg);border:none;overflow:hidden;position:relative}
.join .label{color:var(--call-muted)}
.join-stage{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:560px){.join-stage{grid-template-columns:1fr}}
.join-stage canvas{width:100%;max-width:200px;aspect-ratio:1;border-radius:16px;background:var(--call-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--call-fg);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--call-fg);color:var(--call)}
.join .btn.primary{margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:10px;padding:12px}
.stat b{display:block;font:700 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.weak{display:flex;flex-direction:column;gap:10px}
.weak-row{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:10px;align-items:center}
.weak-row .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.weak-row .bar i{display:block;height:100%;background:var(--err)}
.weak-row.better .bar i{background:var(--ok)}
.weak-row small{color:var(--muted);display:block}
.hw{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.hw-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.pill{font:500 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.todo{background:var(--err-bg);color:var(--err)}
.pill.done{background:var(--ok-bg);color:var(--ok)}
.ex{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-top:1px dashed var(--line)}
.ex textarea{min-height:44px;resize:vertical;width:100%}
.ex .fb{font-size:14px;border-radius:8px;padding:8px 10px}
.ex .fb.good{background:var(--ok-bg)}
.ex .fb.bad{background:var(--err-bg)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;gap:6px;align-items:center}
.hist{display:flex;flex-direction:column;gap:10px}
.hist-item{border-left:3px solid var(--line);padding-left:12px}
.hist-item time{font:12px var(--f-mono);color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:12px;border:1px dashed var(--line);border-radius:10px}
.vocab{display:flex;flex-wrap:wrap;gap:6px}
.vocab span{background:var(--surface-2);border-radius:8px;padding:4px 8px;font-size:13px}
.vocab span em{color:var(--muted);font-style:normal}

/* ---------- call ---------- */
.call{position:fixed;inset:0;background:var(--call);color:var(--call-fg);display:flex;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.call-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.call-top .label{color:var(--call-muted)}
.rec{display:flex;align-items:center;gap:8px;font:13px var(--f-mono);font-variant-numeric:tabular-nums}
.rec i{width:8px;height:8px;border-radius:50%;background:#58d68d;box-shadow:0 0 0 3px rgba(88,214,141,.2)}
.call-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:12px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
@media (max-width:820px){.call-body{grid-template-columns:1fr;grid-template-rows:minmax(200px,42%) minmax(0,1fr)}}
.stage{position:relative;border-radius:18px;overflow:hidden;background:var(--call-2);min-height:0}
.stage canvas.teacher{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border-radius:8px;padding:5px 10px;font-size:13px;display:flex;align-items:center;gap:8px}
.tag .dot{width:7px;height:7px;border-radius:50%;background:var(--call-muted)}
.tag.speaking .dot{background:#58d68d}
.tag.thinking .dot{background:#f0c05a;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.captions{position:absolute;left:50%;transform:translateX(-50%);bottom:52px;width:min(88%,640px);text-align:center;font-size:clamp(15px,2vw,19px);line-height:1.35;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.captions span{background:rgba(0,0,0,.6);padding:2px 8px;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.captions small{display:block;margin-top:6px;font-size:.8em;opacity:.8}
.self{position:absolute;right:12px;top:12px;width:clamp(96px,18%,160px);aspect-ratio:4/3;border-radius:12px;background:linear-gradient(135deg,#2b3a3f,#1e2a2e);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;overflow:hidden}
.self .avatar{width:44%;aspect-ratio:1;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 clamp(14px,2vw,22px) var(--f-display);transition:box-shadow .15s}
.self.live .avatar{box-shadow:0 0 0 4px rgba(88,214,141,.5),0 0 0 9px rgba(88,214,141,.18);animation:breathe 1.2s infinite}
@keyframes breathe{50%{box-shadow:0 0 0 6px rgba(88,214,141,.35),0 0 0 14px rgba(88,214,141,.1)}}
.self small{position:absolute;left:8px;bottom:6px;font-size:11px;color:var(--call-muted)}
.side{display:flex;flex-direction:column;min-height:0;background:var(--call-2);border-radius:18px;overflow:hidden}
.side-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08);gap:8px;flex-wrap:wrap}
.side-head .label{color:var(--call-muted)}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tgl{background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--call-fg);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.tgl[aria-pressed="true"]{background:var(--call-fg);color:var(--call)}
.log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.msg{max-width:92%;display:flex;flex-direction:column;gap:6px}
.msg .bubble{padding:9px 12px;border-radius:14px;line-height:1.45;overflow-wrap:anywhere}
.msg.t{align-self:flex-start}
.msg.t .bubble{background:rgba(255,255,255,.07);border-top-left-radius:4px}
.msg.u{align-self:flex-end;align-items:flex-end}
.msg.u .bubble{background:#2a4f58;border-top-right-radius:4px}
.msg .who{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--call-muted)}
.fix{background:#2b1f1d;border:1px solid rgba(255,138,122,.3);border-radius:10px;padding:8px 10px;font-size:13.5px;display:flex;flex-direction:column;gap:3px;width:100%;text-align:left}
.fix del{color:#ff9d90;text-decoration-thickness:1.5px}
.fix ins{color:#8be3b0;text-decoration:none;font-weight:600}
.fix p{margin:0;color:#d8cfcc}
.fix.ok{background:#1b2e24;border-color:rgba(139,227,176,.3)}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{font-size:12px;background:rgba(240,192,90,.12);color:#f3d48f;border-radius:6px;padding:2px 7px}
.typing{color:var(--call-muted);font-size:13px;font-style:italic}
.partial{align-self:flex-end;color:var(--call-muted);font-style:italic;font-size:14px;max-width:92%}
.compose{display:flex;gap:8px;padding:10px;border-top:1px solid rgba(255,255,255,.08)}
.compose input{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:10px 14px;color:var(--call-fg)}
.compose button{border-radius:999px;border:none;background:var(--call-fg);color:var(--call);padding:0 16px;font-weight:600;cursor:pointer}
.controls{display:flex;justify-content:center;align-items:center;gap:14px;padding:14px 16px 16px;flex-wrap:wrap}
.cbtn{width:56px;height:56px;border-radius:50%;border:none;background:#2a3639;color:var(--call-fg);display:grid;place-items:center;cursor:pointer;transition:transform .12s,background .15s}
.cbtn:hover{background:#34444a}
.cbtn:active{transform:scale(.94)}
.cbtn svg{width:24px;height:24px}
.cbtn.mic{width:68px;height:68px;background:#e8ecea;color:#121a1d}
.cbtn.mic.live{background:#58d68d}
.cbtn.end{background:#d64545;color:#fff;width:64px}
.cbtn.end:hover{background:#e25555}
.cbtn:disabled{opacity:.4;cursor:default}
.cbtn-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--call-muted)}

/* ---------- report ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,14,16,.6);z-index:30;display:grid;place-items:center;padding:16px;overflow-y:auto}
.report{background:var(--surface);color:var(--fg);border-radius:20px;max-width:720px;width:100%;padding:26px;display:flex;flex-direction:column;gap:16px;max-height:calc(100% - 16px);overflow-y:auto}
.report h2{font-size:28px}
.report ul{margin:0;padding-left:20px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.notice{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:14px}
/* skills, sound check, flashcards, analysis states */
.skills{display:flex;flex-direction:column;gap:8px}
.skill{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:14px}
.skill .bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.skill .bar i{display:block;height:100%;background:var(--sky)}
.skill b{font:500 12px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.lvl-note{font-size:13px;color:var(--muted);margin:0}
.check{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.check .status{font-size:13px;color:var(--muted);flex-basis:100%}
.check .status.ok{color:var(--ok)}
.check .status.bad{color:var(--err)}
.btn.sm{padding:6px 12px;font-size:13px}
.vocab-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.box-dots{display:inline-flex;gap:2px;margin-left:4px;vertical-align:middle}
.box-dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.box-dots i.on{background:var(--ok)}
.flash{background:var(--surface);color:var(--fg);border-radius:20px;max-width:520px;width:100%;padding:24px;display:flex;flex-direction:column;gap:14px}
.flash .prompt{font:700 clamp(22px,4vw,30px)/1.2 var(--f-display);text-wrap:balance}
.flash input{font-size:18px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.flash .res{border-radius:10px;padding:10px 12px}
.flash .res.good{background:var(--ok-bg)}
.flash .res.bad{background:var(--err-bg)}
.flash .res.mid{background:var(--surface-2)}
.flash-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.checking{font-size:12px;color:var(--call-muted);font-style:italic}
.fix.better{background:#2b261a;border-color:rgba(240,192,90,.3)}
.fix.better ins{color:#f3d48f}
.fix .k{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--call-muted)}
.gap-chip{font-size:12px;background:rgba(108,182,201,.15);color:#a8d8e6;border-radius:6px;padding:2px 7px}
.retry{align-self:flex-start;background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--call-fg);border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer}
.bubble .w{cursor:pointer;border-radius:3px;transition:background .1s}
.bubble .w:hover,.bubble .w:focus-visible{background:rgba(255,255,255,.14);outline:none}
.bubble .w.sel{background:rgba(240,192,90,.28)}
.def{background:#1f2a2e;border:1px solid rgba(240,192,90,.35);border-radius:10px;padding:9px 11px;font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.def b{font-family:var(--f-display);font-size:15px;color:#f3d48f}
.def p{margin:0;color:#dfe6e3}
.def .ex{color:var(--call-muted);font-style:italic}
.def .row button{background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--call-fg);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.mic-help{background:var(--err-bg);color:var(--fg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.mic-help p{margin:0}
.mic-help .btn{align-self:flex-start;margin-top:4px}
.log .mic-help{background:#2b1f1d;color:#f1e6e3;border:1px solid rgba(255,138,122,.3)}
.log .mic-help .btn{background:#eef2ef;color:#121a1d;border:none}
.heard{margin:0;font-size:15px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.type-pill{font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:#f0c05a;color:#121a1d}
.type-pill.role{background:#8fd0e0}.type-pill.debate{background:#ff9d90}.type-pill.listen{background:#b9a6f0}.type-pill.grammar{background:#9fe0b4}.type-pill.vocab{background:#f3d48f}.type-pill.review{background:#d8d2c6}.type-pill.story{background:#f2b8d0}.type-pill.idioms{background:#c9e27a}
.type-pill.light{font-size:10px;padding:4px 6px}
.dur{font:500 12px var(--f-mono);color:var(--call-muted)}
.linkbtn{background:none;border:none;color:var(--call-fg);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px;padding:4px 0;opacity:.85}
.custom{display:flex;flex-direction:column;gap:8px;border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
.custom .label{color:var(--call-muted)}
.custom-input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 14px;color:var(--call-fg)}
.prog{display:flex;flex-direction:column}
.prog-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.prog-row:first-child{border-top:none}
.prog-n{font:500 12px var(--f-mono);color:var(--muted)}
.prog-topic{font-weight:600;overflow-wrap:anywhere}
.prog-actions{display:flex;gap:6px}
.time-track{height:3px;background:rgba(255,255,255,.08);margin:0 max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-radius:2px;overflow:hidden}
.time-track i{display:block;height:100%;width:0;background:#58d68d;transition:width 1s linear}
.rec.over{color:#f0c05a}
.timeup{background:#2b261a;border:1px solid rgba(240,192,90,.35);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.timeup p{margin:0;color:#e8dfc8}

function pronounceChip(l, v) {
  const status = h("small", { class: "pr-status", text: v.ok ? "Compris ✓" : "" });
  const listen = h("button", { class: "btn sm", type: "button", text: "Écouter", onclick: async () => { const s = Voice.slow; Voice.slow = true; await Voice.speak([{ lang: "en", text: v.term }], "en"); Voice.slow = s; } });
  const say = h("button", { class: "btn sm", type: "button", disabled: !CAP.dictation, title: CAP.dictation ? "" : "Micro indisponible dans cette fenêtre", text: "Je le dis" });
  say.onclick = () => {
    const dd = CAP.dictation; if (!dd) return;
    if (dd.active()) { dd.stop().catch(() => {}); return; }
    Voice.stop();
    let heard = [], offs = [];
    const done = () => {
      offs.forEach(f => { try { f(); } catch {} }); say.textContent = "Je le dis";
      const got = heard.join(" ");
      if (!got) { status.textContent = "Rien entendu, réessaie."; return; }
      const ok = norm(got).includes(norm(v.term)) || lev(norm(got), norm(v.term)) <= Math.max(1, Math.floor(norm(v.term).length / 8));
      status.textContent = ok ? "Compris ✓" : `Entendu : « ${got} »`;
      status.className = "pr-status " + (ok ? "ok" : "ko");
      if (ok) { v.ok = (v.ok || 0) + 1; saveLang(l); }
    };
    offs = [dd.onFinal(({ text }) => { if (str(text)) { heard.push(str(text)); dd.stop().catch(() => {}); } }),
            dd.onState(({ state }) => { if (state === "listening") say.textContent = "J'écoute…"; if (state === "idle") done(); })];
    Mic.start("en").catch(e => { offs.forEach(f => f()); say.textContent = "Je le dis"; status.textContent = e?.code === "not_granted" ? "Micro refusé" : "Micro indisponible"; });
    setTimeout(() => { if (dd.active()) dd.stop().catch(() => {}); }, 6000);
  };
  return h("div", { class: "pr-chip" },
    h("div", { class: "pr-term", text: v.term }),
    h("div", { class: "pr-ipa", text: [v.say, v.ipa ? `/${v.ipa.replace(/^\/|\/$/g, "")}/` : ""].filter(Boolean).join("  ·  ") }),
    h("div", { class: "row", style: "gap:6px" }, listen, say), status);
}

function buildRound(iv) {
  const Q = iv.questions.map((q, i) => ({ q, i }));
  const isT = x => /tell me about yourself/i.test(x.q.q);
  const cat = x => x.q.cat || (isT(x) ? "warmup" : /questions?.{0,20}(for|to ask) (me|us)|salary|when could you start|start date/i.test(x.q.q) ? "closing" : "technical");
  const tmay = Q.find(isT);
  const groups = ["technical", "situation", "behavioural"].map(c => Q.filter(x => cat(x) === c).sort(() => Math.random() - .5));
  const mixed = []; while (groups.some(g => g.length)) for (const g of groups) if (g.length) mixed.push(g.shift());
  const core = [...Q.filter(x => cat(x) === "warmup" && !isT(x)).slice(0, 2), ...mixed].slice(0, 11);
  const queue = [], phases = [];
  if (tmay) { queue.push(tmay.i, tmay.i); phases.push("warm1", "warm2"); }
  core.forEach(x => { queue.push(x.i); phases.push("mock"); });

/* =========================================================

   ========================================================= */
const Voice = {
  slow: false,
  muted: false,
  engine: "none",           // "claude" | "browser" | "none"
  gen: 0,
  stateCb: null,
  _browserVoices: [],
  init() {
    if (CAP.tts) {
      this.engine = "claude";
      try { CAP.tts.onState(({ state }) => this._state(state === "speaking" || state === "starting")); } catch {}
    } else if ("speechSynthesis" in window) this.engine = "browser";

  },
  async ensureVoices() {

      const t = setTimeout(r, 1500);
      try { speechSynthesis.addEventListener("voiceschanged", () => { clearTimeout(t); r(); }, { once: true }); } catch { r(); }

  },
  // best native voice: British voice for Emma, Spain-Spanish woman for Elena; never a French voice
  _lock: {},
  voicesFor(lang) { return (this._browserVoices || []).filter(v => (v.lang || "").replace("_", "-").toLowerCase().startsWith(lang)); },
  pickVoice(lang) {
    // 1. the voice the student chose, 2. the voice already used this session: never switch mid-lesson
    const chosen = S.profile?.voices?.[lang];
    const byName = n => n && (this._browserVoices || []).find(v => v.name === n);
    if (byName(chosen)) return byName(chosen);
    if (byName(this._lock[lang])) return byName(this._lock[lang]);
    const v = this._autoVoice(lang);
    if (v) this._lock[lang] = v.name;
    return v;
  },
  _autoVoice(lang) {

    const MALE_EN = /(uk english male|daniel|arthur|oliver|george|ryan|thomas|harry|alfie|elliot|noah|ethan|malcolm)/i;
    const FEMALE = /(female|kate|serena|martha|libby|sonia|hazel|susan|stephanie|fiona|moira|tessa|karen|samantha|maisie|bella|mia)/i;
    const FEMALE_ES = /(m[oó]nica|luc[ií]a|elvira|helena|laura|esperanza|abril|marisol|paulina|google espa)/i;
    let best = null, bs = 0;
    for (const v of this._browserVoices || []) {
      const vl = (v.lang || "").replace("_", "-").toLowerCase(), n = v.name || "";
      let sc = vl === want ? 100 : vl.startsWith(lang) ? 20 : -1;
      if (sc < 0) continue;
      if (/natural|neural|premium|enhanced/i.test(n)) sc += 15;
      if (v.localService) sc += 12;
      else if (/google/i.test(n)) sc += 4;
      if (lang === "en") { if (FEMALE.test(n)) sc += 30; if (MALE_EN.test(n)) sc -= 10; }   // Emma: prefer a woman's voice
      if (lang === "es" && FEMALE_ES.test(n)) sc += 20;
      if (sc > bs) { bs = sc; best = v; }
    }
    return best;
  },
  // Emma always uses a real British voice when the computer has one
  nativeVoice(lang) {
    const v = this.pickVoice(lang); if (!v) return null;
    const vl = (v.lang || "").replace("_", "-").toLowerCase();
    return (lang === "en" ? vl === "en-gb" : vl.startsWith(lang)) ? v : null;
  },
  britishVoice() { const v = this.pickVoice("en"); return v && (v.lang || "").replace("_", "-").toLowerCase() === "en-gb" ? v : null; },
  voiceLabel(l) {
    const sys = chosenSystemVoice(l); if (sys) return `Voix : ${sys.name} (${sys.lang})`;
    if (CAP.tts && (wantsClaudeVoice(l) || claudeFirst(l) || !this.nativeVoice(l))) return `Voix de Claude « ${claudeVoice(l)} » (${l === "en" ? "anglais britannique, en-GB" : "espagnol d'Espagne"})`;
    const micCall = micMode() === "call" && CAP.dictation;
    const v = l === "en" ? this.britishVoice() : null;
    if (v) return `Voix : ${v.name} (anglais britannique)`;
    if (l === "es" && this.nativeVoice("es")) return `Voix : ${this.nativeVoice("es").name}`;
    if (l === "es" && !micCall && this.engine === "claude") return "Voix Claude (espagnol)";

  _state(on) { if (!on && Avatar.st.speaking) C.deafUntil = now() + 2500; Avatar.set({ speaking: on }); try { this.stateCb?.(on); } catch {} },
  // parts: [{lang: "es"|"en"|"fr", text}]
  route(lang) {
    if ("speechSynthesis" in window && !wantsClaudeVoice(lang)) {
      const v = chosenSystemVoice(lang) || (claudeFirst(lang) ? null : this.nativeVoice(lang));
      if (v) return { kind: "browser", voice: v };
    }
    if (CAP.tts && this.engine === "claude") return { kind: "claude" };
    if ("speechSynthesis" in window) { const v = this.pickVoice(lang); if (v && (v.lang || "").toLowerCase().startsWith(lang)) return { kind: "browser", voice: v }; }

  },
  streamStart(lang) {
    const g = ++this.gen;
    const st = this._st = { g, lang, route: this.route(lang), pending: 0, done: false, started: false, used: false };
    st.promise = new Promise(r => st.resolve = r);
    if (st.route.kind === "browser") { try { speechSynthesis.cancel(); } catch {} }
    if (st.route.kind === "claude" && C.open && CAP.dictation?.active?.()) { try { CAP.dictation.stop(); } catch {} }
    return st;
  },
  streamPush(text) {
    const st = this._st;
    text = str(text).replace(/[*_#`~<>]/g, "");
    if (!st || st.g !== this.gen || !text || this.muted) return;
    st.used = true;
    const rate = this.slow ? .78 : 1;

    }
  },
  streamEnd() {

  _streamEnd(st) { if (st.route.kind === "browser" && st.g === this.gen) this._state(false); st.resolve(); },

    if (!parts.length || this.muted) return;
    const myGen = ++this.gen;
    const rate = this.slow ? .78 : 1;
    await this.ensureVoices();
    if (myGen !== this.gen) return;
    // one voice per teacher for the whole lesson: a native browser voice when the computer has one
    const lang0 = parts[0].lang;
    parts = parts.map(p => ({ ...p, lang: lang0 }));
    if (this.route(lang0).kind === "browser") return this._browser(parts, rate, myGen);
    // no voice of this language on the computer (or Claude's voice chosen): use Claude's native voice,
    // never let the browser read English or Spanish with a French voice
    if (CAP.tts && this.engine === "claude") {
      if (C.open && CAP.dictation?.active?.()) { try { await CAP.dictation.stop(); } catch {} }   // Claude's voice cannot play while listening
      const lines = parts.map(p => ({ text: p.text, language: ACCENT_CODE[p.lang] || p.lang }));
      const opts = { voice: claudeVoice(lang0), rate };
      try { await CAP.tts.speak(lines, opts); return; }
      catch (e) {
        if (["stopped", "busy"].includes(e?.code) || e?.reason === "replaced" || e?.reason === "viewer_stopped") return;

  },
  _browser(parts, rate, myGen) {

        if (buf && (buf + " " + t).length > 220) { chunks.push({ lang: p.lang, text: buf }); buf = t; }
        else buf = buf ? buf + " " + t : t;

      if (buf) chunks.push({ lang: p.lang, text: buf });
    }

      try { speechSynthesis.cancel(); } catch {}
      let i = 0;
      const next = () => {
        if (myGen !== this.gen || i >= chunks.length) { this._state(false); return resolve(); }

        u.onend = () => next();

  stop() {

  },
  label() { return this.engine === "claude" ? "Voix Claude" : this.engine === "browser" ? "Voix du navigateur (secours)" : "Aucune voix disponible"; }
};

- Si l'élève te parle de la séance elle-même, même en français (changer de sujet, aller plus lentement, travailler seulement un point précis comme sa présentation, poser une question sur le métier), comprends-le, réponds-y directement et adapte la séance immédiatement, sans continuer l'exercice prévu.
- AUCUNE traduction, AUCUN mot de français, quoi qu'il arrive. Si l'élève dit « (No entiendo) » ou équivalent, redis la même idée avec des mots plus simples et un exemple. S'il demande de l'aide, donne-lui un modèle de réponse en ${LANGS[l].name.toLowerCase()} à répéter.

FORMAT : uniquement un objet JSON :
{"say":[{"lang":"${l}","text":"ta réplique, uniquement en ${LANGS[l].name.toLowerCase()}"}],"done":false,"new_words":[{"word":"mot nouveau","meaning":"définition très simple EN ${LANGS[l].name.toUpperCase()} (jamais en français), avec des mots plus faciles que le mot lui-même"}]}`;
}
function analysisPrompt(l, teacherLine, said) {
  const d = S.data[l];
  return `Tu es une correctrice experte en ${LANGS[l].name.toLowerCase()} langue étrangère pour francophones. Analyse la dernière intervention orale de l'élève ${S.profile.name} pendant un cours en visio.
Niveau estimé jusqu'ici : ${C.liveLevel || d.level}${d.assessed ? "" : " (non vérifié)"}.
Lacunes déjà suivies (réutilise ces libellés exacts si c'est le même problème) : ${weakLabels(l).map(w => w.label).join(" ; ") || "aucune"}
Mots cibles qu'on veut lui faire réutiliser : ${C.targets.map(v => v.w).join(", ") || "aucun"}

${l === "en" ? `Objectif professionnel de l'élève : ${goalEn()}. Pour "vocab_gaps" et "better", privilégie la terminologie professionnelle exacte (recherche clinique, santé, oncologie, cosmétique, entretien) et signale le vocabulaire trop vague pour un contexte pro.\n` : ""}Ce que le prof venait de dire : « ${teacherLine || "(début de séance)"} »
Ce que l'élève a répondu${said.startsWith("[oral]") ? " (transcrit par reconnaissance vocale : ignore ponctuation, majuscules et accents manquants)" : ""} : « ${said.replace(/^\[oral\]\s*/, "")} »

Fais :
1. "corrections" : CHAQUE vraie erreur (grammaire, conjugaison, accord, vocabulaire, préposition, faux ami, ordre des mots). "original" = passage exact fautif, "corrected" = forme correcte, "explanation" = la règle expliquée EN ${LANGS[l].name.toUpperCase()} (jamais en français), en 1 phrase avec des mots adaptés à son niveau, "category" = libellé court de la lacune (ex. "ser / estar", "accord en genre", "present perfect vs prétérit", "prépositions", "faux amis", "vocabulaire manquant").
2. "better" : 0 à 2 formulations correctes mais améliorables (plus naturel, plus précis, plus riche) adaptées à son niveau : {"said","better","why" (EN ${LANGS[l].name.toUpperCase()}, simple)}.
3. "vocab_gaps" : les mots qui lui ont manqué ou qu'il devrait apprendre d'après cette réponse : mots dits en français, contournements, mot trop basique à enrichir, mot mal choisi. {"word" (en ${LANGS[l].name.toLowerCase()}, avec article pour un nom ${l === "es" ? "espagnol" : ""}),"meaning" (définition très simple EN ${LANGS[l].name.toUpperCase()}, jamais en français),"example" (phrase courte d'exemple)}. Maximum 3.
4. "used_targets" : les mots cibles qu'il a employés correctement.
6. "accent" : seulement si le texte vient de la reconnaissance vocale ([oral]) : les mots que la reconnaissance a visiblement mal compris (mot absurde dans le contexte, quasi-homophone) révèlent un problème de prononciation. Pour chacun : {"heard":"ce qui a été transcrit","meant":"le mot voulu","issue":"son en cause, libellé court parmi : th, h, i / ee, accent tonique, -ed, voyelles faibles, r, rythme, r / rr, jota, b / v, vocales, ll / y","tip":"conseil de prononciation en anglais simple, 1 phrase"}. Maximum 3, tableau vide si rien de net.
5. "level" : le niveau CECRL que cette intervention démontre (${LEVELS.join(", ")}). Juge sur ce qui est réellement produit : complexité, exactitude, étendue du vocabulaire. Une phrase très courte et simple ne prouve pas un niveau élevé.
Si l'intervention est en français, considère que l'élève ne savait pas le dire : propose la phrase en ${LANGS[l].name.toLowerCase()} en "corrections" (original = sa phrase en français) et les mots manquants en "vocab_gaps".
Tout le texte destiné à l'élève (explanation, why, meaning) est EN ${LANGS[l].name.toUpperCase()}, jamais en français.

Réponds uniquement en JSON :
{"corrections":[{"original":"","corrected":"","explanation":"","category":""}],"better":[{"said":"","better":"","why":""}],"vocab_gaps":[{"word":"","meaning":"","example":""}],"used_targets":[],"level":"B1","accent":[{"heard":"","meant":"","issue":"","tip":""}]}`;
}

function flashcards(l, list) {
  const queue = (list || dueWords(l, 15)).slice();
  if (!queue.length) return;
  const retried = new Set();
  let done = 0, good = 0;
  const total = queue.length;
  const card = h("div", { class: "flash", role: "dialog", "aria-label": "Révision du vocabulaire" });
  const ov = h("div", { class: "overlay" }, card);
  document.body.append(ov);
  const close = () => { Voice.stop(); ov.remove(); saveLang(l); renderLobby(); };
  function show() {
    const v = queue.shift();
    if (!v) {
      fillEl(card, h("h2", { text: "Révision terminée" }), h("p", { text: `${good} bonne${good > 1 ? "s" : ""} réponse${good > 1 ? "s" : ""} sur ${total} mots. Les mots ratés reviendront plus tôt.` }),
        h("button", { class: "btn primary", onclick: close, text: "Fermer" }));
      return;
    }
    const input = h("input", { id: "flash-answer", autocomplete: "off", autocapitalize: "off", spellcheck: "false", placeholder: l === "es" ? "Escribe la palabra…" : "Type the word…", "aria-label": "Ta réponse" });
    const res = h("div", { class: "res", hidden: true });
    const listen = h("button", { class: "btn sm", type: "button", hidden: true, onclick: () => Voice.speak([{ lang: l, text: v.w + (v.ex ? ". " + v.ex : "") }], l), text: "Écouter" });
    const nextBtn = h("button", { class: "btn primary", type: "button", hidden: true, onclick: show, text: "Suivant" });
    const checkBtn = h("button", { class: "btn primary", type: "submit", text: "Vérifier" });
    const skip = h("button", { class: "btn", type: "button", onclick: () => judge(true), text: "Je ne sais pas" });
    function judge(gaveUp) {
      const a = input.value;
      let r;
      if (!gaveUp && strict(a) === strict(v.w)) r = ["good", "Parfait !"];
      else if (!gaveUp && norm(a) === norm(v.w)) r = ["good", "Juste, attention aux accents."];
      else if (!gaveUp && norm(a).length > 3 && lev(norm(a), norm(v.w)) <= 1) r = ["mid", "Presque ! Une lettre de différence."];
      else r = ["bad", gaveUp ? "Pas grave, retiens-le :" : "Pas tout à fait."];
      grade(v, r[0]);
      if (r[0] === "good") good++;
      if (r[0] !== "good" && !retried.has(v)) { retried.add(v); queue.push(v); }
      done++;
      res.hidden = false; res.className = "res " + (r[0] === "good" ? "good" : r[0] === "mid" ? "mid" : "bad");
      fillEl(res, h("strong", { text: r[1] + " " }), h("span", { text: v.w }), v.ex ? h("div", { class: "muted", style: "font-size:14px;margin-top:4px", text: v.ex }) : null);
      input.disabled = true; checkBtn.hidden = true; skip.hidden = true; listen.hidden = false; nextBtn.hidden = false;
      Voice.speak([{ lang: l, text: v.w }], l);
      nextBtn.focus();
    }
    const form = h("form", { onsubmit: e => { e.preventDefault(); if (!input.disabled) { if (input.value.trim()) judge(false); else input.focus(); } }, style: "display:flex;flex-direction:column;gap:12px" },
      h("span", { class: "label", text: l === "es" ? "¿Qué palabra es?" : "Which word is it?" }),
      v.ex ? h("p", { class: "muted", style: "margin:0", text: blankOut(v.ex, v.w) }) : null,
      h("div", { class: "prompt", text: v.m || "?" }),
      input, res,
      h("div", { class: "row" }, checkBtn, skip, listen, nextBtn));
    fillEl(card, 
      h("div", { class: "flash-top" }, h("span", { class: "label", text: `Carte ${Math.min(done + 1, total + retried.size)} · ${queue.length} restante${queue.length > 1 ? "s" : ""}` }),
        h("button", { class: "btn sm", onclick: close, text: "Arrêter" })),
      form);
    input.focus();
  }
  show();
}

function finishHomeworkIfDone(l, hw) {

/* One exercise with an instant check. Used by homework and the vocabulary workshop. */
function exerciseBlock(l, ex, i, { idBase, onDraft, onChecked, words }) {

    input = h("div", { class: "opts", role: "radiogroup", "aria-labelledby": idBase + "-q" }, ex.options.map(o => h("label", null,
      h("input", { type: "radio", name: idBase, value: o, checked: ex.answer === o, disabled: done }), o)));
    input.addEventListener("change", e => { ex.answer = e.target.value; onDraft?.(); });
  } else {
    const multi = ex.type === "write" || ex.type === "use";
    input = h(multi ? "textarea" : "input", { id: idBase, rows: multi ? 3 : undefined, autocomplete: "off", spellcheck: "false", placeholder: multi ? (l === "es" ? "Escribe aquí…" : "Write here…") : (l === "es" ? "Tu respuesta" : "Your answer"), disabled: done });
    input.value = ex.answer || "";
    input.addEventListener("input", () => { ex.answer = input.value; onDraft?.(); });
  }
  const check = h("button", { class: "btn sm primary", type: "button", hidden: done, text: l === "es" ? "Comprobar" : "Check" });
  const fb = h("div", { class: "fb " + (ex.correct ? "good" : "bad"), hidden: !done },
    h("strong", { text: ex.correct ? (l === "es" ? "¡Correcto! " : "Correct! ") : (l === "es" ? "Casi… " : "Not quite… ") }), ex.feedback || "");
  const run = async () => {
    if (!str(ex.answer)) { input.focus?.(); return; }
    check.disabled = true; check.textContent = "…";
    try {
      const r = await gradeOne(l, ex);
      ex.correct = r.correct; ex.feedback = r.feedback; ex.checked = true;
      if (!r.correct && r.category) applyWeakness(l, [{ label: r.category, delta: 1 }]);
      if (!r.correct && arr(words).length) addVocab(l, words, "lacune");
      onChecked?.();
    } catch (e) { check.disabled = false; check.textContent = l === "es" ? "Comprobar" : "Check"; toast(errCopy(e)); }
  };
  check.onclick = run;
  if (input.tagName === "INPUT") input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); run(); } });
  return h("div", { class: "ex" },
    h("label", { for: idBase, id: idBase + "-q", style: "font-weight:600" }, `${i + 1}. `, ex.prompt),
    ex.hint ? h("small", { class: "muted", text: ex.hint }) : null,
    input, h("div", { class: "row" }, check), fb);

const isChecked = ex => !!(ex.checked || ex.feedback);
function expectedList(ex) { return str(ex.expected).split(/\s*(?:\/|\||;| or | o )\s*/).map(norm).filter(Boolean); }
/* Instant grading: exact answers locally (no wait), anything open-ended by Claude in a few seconds */
async function gradeOne(l, ex) {
  const ans = str(ex.answer), exp = expectedList(ex);
  if (ex.type === "qcm" && ex.expected) {
    const ok = norm(ans) === norm(ex.expected);
    return { correct: ok, feedback: ok ? "" : `→ ${ex.expected}` };
  }
  if (exp.length && exp.includes(norm(ans))) {
    const accentsOff = !str(ex.expected).split(/\s*(?:\/|\||;)\s*/).some(e => e.trim().toLowerCase() === ans.toLowerCase().replace(/[.!?]$/, ""));
    return { correct: true, feedback: accentsOff && l === "es" ? `(${l === "es" ? "ojo con los acentos" : ""}: ${ex.expected})` : "" };
  }
  const L = LANGS[l].name.toUpperCase();
  const r = await askJSON(`Corrige un exercice de ${LANGS[l].name.toLowerCase()} d'un apprenant (niveau ${S.data[l].level}).
Consigne : ${ex.prompt}${ex.options ? "\nChoix : " + ex.options.join(" / ") : ""}${ex.expected ? "\nRéponse attendue (d'autres réponses correctes sont acceptables) : " + ex.expected : ""}
Réponse de l'élève : ${ans}
Accepte toute réponse correcte et naturelle, même différente de la réponse attendue. Ignore les majuscules et la ponctuation.
"feedback" : EN ${L} simple (jamais en français), 1 ou 2 phrases : si c'est faux, donne la bonne réponse et la raison ; si c'est juste mais améliorable, propose la version plus naturelle ; si c'est parfait, "".
"category" : si c'est faux, libellé court en français du type d'erreur (ex. "ser / estar", "prépositions", "vocabulaire"), sinon "".
Réponds uniquement en JSON : {"correct":true,"feedback":"","category":""}`, { modelTier: "quick" });
  return { correct: !!r.correct, feedback: str(r.feedback), category: str(r.category) };
}
let draftTimer;
function saveDraft(l) { clearTimeout(draftTimer); draftTimer = setTimeout(() => saveLang(l), 900); }
async function gradeHomework(l, hw, btn) {
  if (!CAP.sample) { toast("Ouvre cette page dans Claude pour faire corriger tes devoirs."); return; }
  if (arr(hw.exercises).every(ex => !str(ex.answer))) { toast("Réponds à au moins un exercice avant de rendre."); return; }
  btn.disabled = true; btn.textContent = `${tn(l)} corrige…`;
  const prompt = `Tu es ${tn(l)}, professeure de ${LANGS[l].name.toLowerCase()} de ${S.profile.name} (francophone). Corrige ses devoirs avec exigence et bienveillance.

${profileContext(l)}

DEVOIR : "${hw.title}" — objectif : ${hw.focus}
${hw.exercises.map((ex, i) => `${i + 1}. [${ex.type}] ${ex.prompt}${ex.options ? " (choix : " + ex.options.join(" / ") + ")" : ""}${ex.expected ? "\n   Réponse attendue : " + ex.expected : ""}\n   Réponse de l'élève : ${str(ex.answer) || "(pas de réponse)"}`).join("\n")}

Pour chaque exercice, dans l'ordre : "correct" (true si juste ou acceptable, accepte les variantes correctes même si différentes de la réponse attendue), "feedback" EN ${LANGS[l].name.toUpperCase()} simple, jamais en français (1-2 phrases : la bonne réponse et pourquoi ; pour une production écrite, réécris la version corrigée et note les fautes). Puis : note sur 10, commentaire encourageant (2 phrases, EN ${LANGS[l].name.toUpperCase()} simple) adressé à ${S.profile.name}, mise à jour des lacunes, et les mots de vocabulaire qu'il ne connaissait pas (max 5, "meaning" = définition simple EN ${LANGS[l].name.toUpperCase()}).
Réponds uniquement en JSON :
{"results":[{"correct":true,"feedback":"..."}],"score":7,"comment":"...","weakness_updates":[{"label":"libellé existant ou nouveau","delta":1,"note":"court"}],"strengths":["..."],"vocab_gaps":[{"word":"","meaning":"","example":""}]}
delta = +1 si l'erreur persiste, -1 si le point est maîtrisé.`;
  try {
    const r = await askJSON(prompt, { effort: "low" });
    arr(r.results).forEach((res, i) => { if (hw.exercises[i]) { hw.exercises[i].correct = !!res?.correct; hw.exercises[i].feedback = str(res?.feedback); } });
    hw.score = Math.max(0, Math.min(10, Math.round(Number(r.score) || 0)));
    hw.comment = str(r.comment);
    hw.status = "done"; hw.doneAt = today();
    applyWeakness(l, r.weakness_updates); addStrengths(l, r.strengths); addVocab(l, r.vocab_gaps, "lacune");
    saveLang(l); renderLobby(); toast(`Devoirs corrigés : ${hw.score}/10`);
  } catch (e) {
    btn.disabled = false; btn.textContent = `Rendre mes devoirs à ${tn(l)}`; toast(errCopy(e));
  }
}
function applyWeakness(l, ups) {
  const d = S.data[l];
  for (const u of arr(ups)) {
    const label = str(u?.label).slice(0, 60); if (!label) continue;
    let w = d.weaknesses.find(x => x.label.toLowerCase() === label.toLowerCase());
    if (!w) { w = { label, count: 0, first: today() }; d.weaknesses.push(w); }
    const delta = Math.max(-3, Math.min(10, Number(u.delta) || 0));
    w.count = Math.max(0, w.count + delta);
    w.trend = delta < 0 ? "better" : delta > 0 ? "worse" : w.trend;
    if (u.note) w.note = str(u.note).slice(0, 120);
    w.last = today();
  }
  d.weaknesses = d.weaknesses.filter(w => w.count > 0 || w.trend === "better").slice(-40);
}
function addStrengths(l, list) {
  const d = S.data[l];
  for (const s of arr(list)) { const v = str(s).slice(0, 80); if (v && !d.strengths.includes(v)) d.strengths.push(v); }
  d.strengths = d.strengths.slice(-20);
}

  const box = h("div", { class: "timeup" },
    h("strong", { text: `Les ${C.spec.minutes} minutes sont écoulées.` }),
    h("p", { text: `${tn(S.cur)} va conclure. Tu peux terminer maintenant pour ton bilan et tes devoirs, ou prolonger.` }),
    h("div", { class: "row" },
      h("button", { class: "retry", type: "button", onclick: () => endCall(), text: "Terminer et voir mon bilan" }),
      h("button", { class: "retry", type: "button", onclick: () => { C.spec.minutes += 5; C.timeUp = false; box.remove(); toast("5 minutes de plus."); }, text: "Prolonger de 5 min" })));
  log.append(box); scrollLog();
}
function flushPending() {
  if (!C.pending || C.busy || !C.open) return;
  const p = C.pending; C.pending = null;
  userSays(p.text, p.oral, p.isHelp);
}

function closeCall() {
  C.open = false;
  clearInterval(C.timer);
  try { C.ctl?.abort(); } catch {}
  Voice.stop(); Voice.stateCb = null;
  try { if (CAP.dictation?.active()) CAP.dictation.stop().catch(() => {}); } catch {}
  C.micOffs.forEach(f => { try { f(); } catch {} }); C.micOffs = [];
  document.removeEventListener("keydown", spaceKey);
  Avatar.set({ listening: false, thinking: false, speaking: false });
  document.querySelector(".call")?.remove();
}

async function endCall() {
  const l = S.cur, d = S.data[l];
  const minutes = Math.max(1, Math.round((now() - C.start) / 60000));
  const studentTurns = C.log.filter(x => x.who === "student").length;
  const spec = { ...C.spec }, objectives = arr(C.objectives).map(o => ({ ...o }));
  const mockLog = arr(C.mockLog).slice();
  const snapshot = { log: C.log.slice(), errors: C.errors.slice(), betters: C.betters.slice(), gaps: C.gaps.slice(), words: C.words.slice(), used: [...C.used], analyses: C.analyses.slice(), live: C.liveLevel };
  closeCall();
  // vocabulary bookkeeping happens even without a report
  addVocab(l, snapshot.words, "cours", spec.domain);
  markUsed(l, snapshot.used);
  if (studentTurns < 2) { saveLang(l); toast("Cours trop court pour un bilan. La séance reste dans ton programme."); renderLobby(); return; }
  // measured progress for this lesson
  const said = snapshot.log.filter(x => x.who === "student").map(x => x.text);
  const metrics = { ept: Math.round(snapshot.errors.length / Math.max(1, said.length) * 100) / 100, wpt: Math.round(said.reduce((a, t) => a + t.split(/\s+/).filter(Boolean).length, 0) / Math.max(1, said.length) * 10) / 10 };
  const metricObj = objectives.find(o => o.kind === "metric");
  if (metricObj) metricObj.achieved = metrics.wpt >= metricObj.target;
  // the session counts: take it off the programme and top the programme up
  d.plan = arr(d.plan).filter(p => p.id !== spec.id);
  if (spec.domain) { d.coverage[spec.domain] = (d.coverage[spec.domain] || 0) + 1; }
  saveLang(l);
  const card = h("div", { class: "report", role: "dialog", "aria-label": "Bilan de séance" },
    h("div", { style: "display:flex;gap:14px;align-items:center" }, h("div", { class: "spinner" }),
      h("div", null, h("h2", { text: `${tn(l)} prépare ton bilan` }), h("p", { class: "muted", style: "margin:0", text: "Niveau réel, lacunes, vocabulaire et devoirs ciblés. Ça peut prendre une minute." }))));
  const ov = h("div", { class: "overlay" }, card);
  document.body.append(ov);
  const transcript = snapshot.log.map(x => (x.who === "student" ? S.profile.name : tn(l)) + " : " + x.text).join("\n").slice(-14000);
  const errs = snapshot.errors.map(e => `- « ${e.original} » → « ${e.corrected} » [${e.category}] ${e.explanation}`).join("\n").slice(-6000) || "- aucune erreur relevée";
  const betters = snapshot.betters.map(b => `- « ${b.said} » → « ${b.better} »`).join("\n").slice(-2000) || "- aucune";
  const gaps = snapshot.gaps.map(g => `${g.word} (${g.meaning})`).join(", ") || "aucun";
  const dueList = dueWords(l, 12).map(v => `${v.w} (${v.m})`).join(", ") || "aucun";
  const signals = snapshot.analyses.map(a => a.level).filter(Boolean).join(", ") || "aucun";
  const isBeginner = LEVELS.indexOf(snapshot.live || d.level) <= 1;
  const prompt = `${TEACHERS[l].intro} Le cours en visio avec ${S.profile.name} vient de se terminer : ${TYPES[spec.type].name}, « ${spec.topic} », ${minutes} min (prévu ${spec.minutes}). Rédige le bilan et les devoirs.

${profileContext(l)}

TRANSCRIPTION
${transcript}

ERREURS RELEVÉES
${errs}

FORMULATIONS À AMÉLIORER
${betters}

MOTS QUI LUI ONT MANQUÉ : ${gaps}
MOTS À RÉVISER (répétition espacée) : ${dueList}
NIVEAUX OBSERVÉS RÉPLIQUE PAR RÉPLIQUE : ${signals}

À FAIRE
1. "summary" : 1 phrase en français pour l'historique.
2. "message" : 2-3 phrases chaleureuses et honnêtes adressées à ${S.profile.name}, EN ${LANGS[l].name.toUpperCase()} adapté à son niveau réel (jamais en français).
3. "level" : son VRAI niveau CECRL (${LEVELS.join(", ")}) d'après ce qu'il a réellement produit, pas d'après son auto-évaluation (${d.declared})${d.assessed ? ` ni par inertie (niveau précédent : ${d.level} ; ne bouge que d'un cran au maximum, sauf preuve nette)` : ""}. "level_note" : la justification en une phrase courte (ex. "phrases simples au présent, peu de connecteurs").
4. "skills" : notes de 0 à 100 pour grammaire, vocabulaire, aisance, comprehension, relatives à un locuteur natif cultivé (100).
5. "top_mistakes" : 3 à 5 erreurs les plus importantes à retenir ("rule" expliquée EN ${LANGS[l].name.toUpperCase()} simple).
6. "weakness_updates" : mise à jour des lacunes. Réutilise les libellés existants. delta = occurrences aujourd'hui, ou -1 pour une lacune bien maîtrisée aujourd'hui.
7. "strengths" : 0 à 3 points forts précis.
8. "vocab_gaps" : 0 à 6 mots ou expressions supplémentaires qu'il devrait apprendre vu ce qu'il a voulu dire (avec article pour les noms ; "meaning" = définition simple EN ${LANGS[l].name.toUpperCase()}, jamais de traduction ; exemple court).
9. "homework" : 6 à 8 exercices CIBLÉS : la moitié sur ses lacunes les plus fréquentes, au moins 2 sur le vocabulaire (mots qui lui ont manqué et mots à réviser), et 1 production écrite ("write") de ${isBeginner ? "2-3 phrases simples" : "80-120 mots"} qui oblige à réemployer ces mots. Types : "fill" (phrase à trous ___), "answer" (répondre à une question avec une phrase complète), "rephrase" (reformuler une phrase avec un mot ou une structure imposée), "qcm" (3 "options"), "write". AUCUNE traduction et AUCUN français : toutes les consignes et indices EN ${LANGS[l].name.toUpperCase()}, simples. "expected" = réponse attendue (sauf "write"). Difficulté adaptée au niveau RÉEL.
${spec.type === "mock" && d.interviews.find(x => x.id === spec.ivId) ? (iv => `C'était un ENTRETIEN BLANC pour le poste ${iv.role}${iv.company ? " chez " + iv.company : ""} (entretien réel : ${iv.date || "bientôt"}).`)(d.interviews.find(x => x.id === spec.ivId)) + ` Les devoirs : réécrire au propre les 2 réponses les plus faibles en version courte et naturelle, et le vocabulaire clé du poste.\n` : ""}${l === "en" ? `Pour Emma : l'objectif est professionnel (${goalEn()}). Au moins 3 exercices sur le vocabulaire professionnel de la recherche clinique et de la santé vu ou manquant aujourd'hui, et la production écrite peut être une réponse d'entretien ou un e-mail professionnel.\n` : `Pour Elena : l'objectif est de converser avec des Espagnols ; privilégie les phrases utiles à l'oral et les réponses à des questions de la vie réelle.\n`}10. "next_goal" : objectif du prochain cours, en une phrase, un cran plus exigeant qu'aujourd'hui.
11. "objectives" : pour chaque objectif de la séance ci-dessous, "achieved" = true seulement si l'élève l'a clairement réussi dans la transcription, et une note courte en français.
${objectives.filter(o => o.kind !== "metric").map(o => `   - id "${o.id}" : ${o.text}`).join("\n") || "   (aucun)"}
12. "demonstrated" : parmi ces points du programme, ceux que l'élève a utilisés correctement et sans aide (copie le texte exact) : ${nextItems(l, 12).map(x => x.item).join(" | ")}
MESURES : ${metrics.ept} erreur(s) par intervention, ${metrics.wpt} mots par intervention${lastMetrics(l, 1)[0] ? ` (séance précédente : ${lastMetrics(l, 1)[0].ept} et ${lastMetrics(l, 1)[0].wpt})` : ""}.

Réponds uniquement en JSON :
{"summary":"","message":"","level":"","level_note":"","skills":{"grammaire":0,"vocabulaire":0,"aisance":0,"comprehension":0},"top_mistakes":[{"wrong":"","right":"","rule":""}],"weakness_updates":[{"label":"","delta":1,"note":""}],"strengths":[],"vocab_gaps":[{"word":"","meaning":"","example":""}],"homework":{"title":"","focus":"","exercises":[{"type":"fill","prompt":"","hint":"","expected":""}]},"next_goal":"","objectives":[{"id":"","achieved":false,"note":""}],"demonstrated":[]}`;
  const ivDone = spec.type === "mock" ? d.interviews.find(x => x.id === spec.ivId) : null;
  const debriefP = ivDone && mockLog.length ? askJSON(debriefPrompt(ivDone, mockLog), {}).catch(() => null) : null;
  let r;
  try { r = await askJSON(prompt, {}); }
  catch (e) {
    d.sessions.push({ date: today(), minutes, errors: snapshot.errors.length, summary: `${sessionTitle(spec)} (bilan non généré)`, type: spec.type, topic: spec.topic, domain: spec.domain, metrics, ...(spec.type === "mock" ? { mockQ: spec.mockQ ?? null, ivId: spec.ivId, format: spec.format || "" } : {}) });
    d.lastObjectives = objectives; updatePlateau(l);
    applyWeakness(l, Object.entries(snapshot.errors.reduce((a, x) => (a[x.category] = (a[x.category] || 0) + 1, a), {})).map(([label, delta]) => ({ label, delta })));
    saveLang(l);
    fillEl(card, h("h2", { text: "Bilan indisponible" }), h("p", { text: errCopy(e) + " Tes erreurs et les mots qui t'ont manqué ont quand même été enregistrés." }),
      h("button", { class: "btn primary", onclick: () => { ov.remove(); renderLobby(); }, text: "Retour" }));
    return;
  }
  const oldLevel = d.assessed ? d.level : null;
  if (LEVELS.includes(r.level)) { d.level = r.level; d.assessed = true; d.levelNote = str(r.level_note).slice(0, 160); }
  if (r.skills && typeof r.skills === "object") for (const [k] of SKILLS) { const v = Number(r.skills[k]); if (Number.isFinite(v)) d.skills[k] = Math.round(Math.max(0, Math.min(100, v))); }
  applyWeakness(l, r.weakness_updates); addStrengths(l, r.strengths); addVocab(l, r.vocab_gaps, "lacune", spec.domain);
  d.sessions.push({ date: today(), minutes, errors: snapshot.errors.length, summary: str(r.summary) || sessionTitle(spec), next: str(r.next_goal), type: spec.type, topic: spec.topic, domain: spec.domain, metrics, ...(spec.type === "mock" ? { mockQ: spec.mockQ ?? null, ivId: spec.ivId, format: spec.format || "" } : {}) });
  // objectives and skill ladder
  const res = new Map(arr(r.objectives).map(o => [str(o?.id), o]));
  for (const o of objectives) if (o.kind !== "metric") { const x = res.get(o.id); o.achieved = !!x?.achieved; o.note = str(x?.note).slice(0, 140); }
  d.mastered = d.mastered || {};
  const ladder = new Set(Object.values(SYLLABUS[l]).flat());
  for (const it of arr(r.demonstrated).map(str)) if (ladder.has(it)) d.mastered[it] = (d.mastered[it] || 0) + 1;
  for (const o of objectives) if (o.kind === "new" && o.achieved && o.item && !arr(r.demonstrated).includes(o.item)) d.mastered[o.item] = (d.mastered[o.item] || 0) + 1;
  d.lastObjectives = objectives;
  updatePlateau(l);
  d.sessions = d.sessions.slice(-30);
  const hwIn = r.homework && typeof r.homework === "object" ? r.homework : null;
  const exs = arr(hwIn?.exercises).filter(ex => str(ex?.prompt)).slice(0, 8);
  if (exs.length) {
    d.homework.push({ id: uid(), date: today(), title: str(hwIn.title) || "Devoirs", focus: str(hwIn.focus), status: "todo",
      exercises: exs.map(ex => {
        const opts = arr(ex.options).map(str).filter(Boolean).slice(0, 5);
        const type = ["fill", "answer", "rephrase", "translate", "qcm", "write"].includes(ex.type) ? ex.type : "answer";
        return { type: type === "qcm" && opts.length < 2 ? "answer" : type, prompt: str(ex.prompt), hint: str(ex.hint), options: opts.length >= 2 ? opts : undefined, expected: str(ex.expected) };
      }) });
    d.homework = d.homework.slice(-12);
  }
  saveLang(l);
  const mistakes = arr(r.top_mistakes).filter(m => str(m?.right));
  fillEl(card, 
    h("span", { class: "label", text: `Bilan · ${minutes} min · ${snapshot.errors.length} correction${snapshot.errors.length > 1 ? "s" : ""} · ${snapshot.gaps.length + arr(r.vocab_gaps).length} mots ajoutés` }),
    h("h2", { text: l === "es" ? `¡Buen trabajo, ${S.profile.name}!` : `Well done, ${S.profile.name}!` }),
    h("p", { style: "margin:0", text: str(r.message) }),
    d.assessed ? h("p", { class: "notice", text: (oldLevel && oldLevel !== d.level ? `Niveau mesuré : ${oldLevel} → ${d.level}. ` : oldLevel ? `Niveau mesuré : ${d.level}. ` : `Ton vrai niveau : ${d.level} (tu t'estimais ${d.declared}). `) + d.levelNote }) : null,
    h("div", null, h("h3", { style: "font-size:16px;margin-bottom:8px", text: "Objectifs du cours" }),
      h("ul", { class: "obj-list" }, objectives.map(o => h("li", { class: o.achieved ? "ok" : "ko", text: `${o.achieved ? "✓" : "✗"} ${o.text}${o.kind === "metric" ? ` (tu as fait ${metrics.wpt})` : o.note ? " · " + o.note : ""}` }))),
      h("p", { class: "muted", style: "margin:6px 0 0;font-size:14px", text: `${metrics.ept} erreur(s) et ${metrics.wpt} mots par intervention${lastMetrics(l, 2).length === 2 ? ` · au cours précédent : ${lastMetrics(l, 2)[0].ept} et ${lastMetrics(l, 2)[0].wpt}` : ""}. Ce qui n'est pas réussi revient au prochain cours.` })),
    d.stretch ? h("p", { class: "plateau", text: "Plateau détecté : le prochain cours montera d'un cran." }) : null,
    mistakes.length ? h("div", null, h("h3", { style: "font-size:16px;margin-bottom:8px", text: "À retenir" }),
      h("div", { style: "display:flex;flex-direction:column;gap:8px" }, mistakes.map(m => h("div", { class: "hw" },
        h("div", null, h("del", { style: "color:var(--err)", text: str(m.wrong) }), "  →  ", h("strong", { style: "color:var(--ok)", text: str(m.right) })),
        str(m.rule) ? h("small", { class: "muted", text: str(m.rule) }) : null)))) : null,
    exs.length ? h("p", { class: "notice", text: `Devoirs : « ${str(hwIn.title) || "Devoirs"} », ${exs.length} exercices sur ${str(hwIn.focus) || "tes lacunes"}.` }) : null,
    str(r.next_goal) ? h("p", { class: "muted", style: "margin:0", text: "Prochain cours : " + str(r.next_goal) }) : null,
    h("button", { class: "btn primary", style: "align-self:flex-start", onclick: () => { ov.remove(); renderLobby(); }, text: "Voir mes devoirs et mon vocabulaire" }));
  if (debriefP) {
    const slot = h("div", { class: "row" }, h("div", { class: "spinner" }), h("p", { style: "margin:0", text: "Emma prépare ton retour détaillé sur l'entretien…" }));
    card.insertBefore(slot, card.children[2] || null);
    const db = await debriefP;
    if (db && typeof db === "object") {
      ivDone.sheet = { ...db, date: today() };
      for (const a of arr(db.answers)) { const q = ivDone.questions.find(x => norm(x.q) === norm(a.q)); if (q && str(a.model)) { q.model = str(a.model); q.phrases = arr(a.phrases).map(str); } }
      saveLang(l);
      slot.replaceWith(debriefView(db, l));
    } else slot.replaceWith(h("p", { class: "muted", text: "Le retour détaillé n'a pas pu être préparé cette fois." }));
  }
}

(async function boot() {
  try {
    await initCaps();
    await Store.init();
    await loadAll();
    if (S.profile?.name) {
      S.data.es = migrate(S.data.es, "A0");
      S.data.en = migrate(S.data.en, "C1");
    }
    Voice.init();
    await Voice.ensureVoices();
    if (S.profile && !S.profile.voiceReset2) { if (S.profile.voices?.en) delete S.profile.voices.en; S.profile.voiceReset2 = true; saveProfile(); }
    const oldEn = str(S.profile?.voices?.en);
    if (oldEn && !oldEn.startsWith("claude:")) {
      const v = Voice.voicesFor("en").find(x => x.name === oldEn);
      if (!v || (v.lang || "").replace("_", "-").toLowerCase() !== "en-gb") { delete S.profile.voices.en; saveProfile(); }
    }
    render();
  } catch (e) {
    console.error(e);
    app().replaceChildren(h("div", { class: "onb" }, h("div", { class: "onb-card" }, h("h1", { text: "L'appli n'a pas pu démarrer" }), h("p", { text: "Recharge la page. Si ça continue, ouvre-la depuis claude.ai." }))));
  }
})();
