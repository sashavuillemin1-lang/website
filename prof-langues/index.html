<title>Clase con Elena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a video-call room. Lobby = carnet de l'élève (progress, devoirs); Call = video tile + live transcript with correction slips. */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --surface-2:#ebe8e1; --line:#d9d4c9;
  --fg:#1d2427; --muted:#5f686b;
  --accent:#c6531f;        /* pimentón */
  --accent-ink:#ffffff;
  --sky:#1f5a6b;           /* english teal */
  --ok:#2f8a5b; --warn:#b5761a; --err:#c23b3b;
  --err-bg:#fbe9e6; --ok-bg:#e5f3ea;
  --call:#121a1d; --call-2:#1b2629; --call-fg:#eef2ef; --call-muted:#94a3a6;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13181a; --surface:#1b2225; --surface-2:#232c30; --line:#334046;
  --fg:#e8ecea; --muted:#9aa6a9; --accent:#ef7a45; --accent-ink:#1a0f09; --sky:#6cb6c9;
  --ok:#5fc78f; --warn:#e3a649; --err:#ff8a7a; --err-bg:#3a2220; --ok-bg:#1d3327;
  --call:#0c1214; --call-2:#162024; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13181a; --surface:#1b2225; --surface-2:#232c30; --line:#334046;
  --fg:#e8ecea; --muted:#9aa6a9; --accent:#ef7a45; --accent-ink:#1a0f09; --sky:#6cb6c9;
  --ok:#5fc78f; --warn:#e3a649; --err:#ff8a7a; --err-bg:#3a2220; --ok-bg:#1d3327;
  --call:#0c1214; --call-2:#162024; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.label{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:600;transition:transform .12s, background .12s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.muted{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;max-width:calc(100% - 32px);font-weight:500}

/* ---------- onboarding ---------- */
.onb{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.onb-card{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:18px}
.onb-card h1{font-size:clamp(28px,5vw,38px)}
.onb-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.onb-row{grid-template-columns:1fr}}

/* ---------- lobby ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}
.brand canvas{width:48px;height:48px;border-radius:50%;background:var(--call)}
.brand h1{font-size:22px}
.hello{font-size:clamp(30px,5vw,48px);margin-bottom:6px}
.lang-tabs{display:flex;gap:8px;flex-wrap:wrap}
.lang-tab{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;min-width:150px;text-align:left}
.lang-tab b{font-family:var(--f-display);font-size:18px}
.lang-tab[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lang-tab.en[aria-pressed="true"]{border-color:var(--sky);box-shadow:inset 0 0 0 1px var(--sky)}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;margin-top:20px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:20px}
.join{background:var(--call);color:var(--call-fg);border:none;overflow:hidden;position:relative}
.join .label{color:var(--call-muted)}
.join-stage{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:560px){.join-stage{grid-template-columns:1fr}}
.join-stage canvas{width:100%;max-width:200px;aspect-ratio:1;border-radius:16px;background:var(--call-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--call-fg);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--call-fg);color:var(--call)}
.join .btn.primary{margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:10px;padding:12px}
.stat b{display:block;font:700 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.weak{display:flex;flex-direction:column;gap:10px}
.weak-row{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:10px;align-items:center}
.weak-row .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.weak-row .bar i{display:block;height:100%;background:var(--err)}
.weak-row.better .bar i{background:var(--ok)}
.weak-row small{color:var(--muted);display:block}
.hw{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.hw-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.pill{font:500 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.todo{background:var(--err-bg);color:var(--err)}
.pill.done{background:var(--ok-bg);color:var(--ok)}
.ex{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-top:1px dashed var(--line)}
.ex textarea{min-height:44px;resize:vertical;width:100%}
.ex .fb{font-size:14px;border-radius:8px;padding:8px 10px}
.ex .fb.good{background:var(--ok-bg)}
.ex .fb.bad{background:var(--err-bg)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;gap:6px;align-items:center}
.hist{display:flex;flex-direction:column;gap:10px}
.hist-item{border-left:3px solid var(--line);padding-left:12px}
.hist-item time{font:12px var(--f-mono);color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:12px;border:1px dashed var(--line);border-radius:10px}
.vocab{display:flex;flex-wrap:wrap;gap:6px}
.vocab span{background:var(--surface-2);border-radius:8px;padding:4px 8px;font-size:13px}
.vocab span em{color:var(--muted);font-style:normal}

/* ---------- call ---------- */
.call{position:fixed;inset:0;background:var(--call);color:var(--call-fg);display:flex;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.call-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.call-top .label{color:var(--call-muted)}
.rec{display:flex;align-items:center;gap:8px;font:13px var(--f-mono);font-variant-numeric:tabular-nums}
.rec i{width:8px;height:8px;border-radius:50%;background:#58d68d;box-shadow:0 0 0 3px rgba(88,214,141,.2)}
.call-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:12px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
@media (max-width:820px){.call-body{grid-template-columns:1fr;grid-template-rows:minmax(200px,42%) minmax(0,1fr)}}
.stage{position:relative;border-radius:18px;overflow:hidden;background:var(--call-2);min-height:0}
.stage canvas.teacher{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border-radius:8px;padding:5px 10px;font-size:13px;display:flex;align-items:center;gap:8px}
.tag .dot{width:7px;height:7px;border-radius:50%;background:var(--call-muted)}
.tag.speaking .dot{background:#58d68d}
.tag.thinking .dot{background:#f0c05a;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.captions{position:absolute;left:50%;transform:translateX(-50%);bottom:52px;width:min(88%,640px);text-align:center;font-size:clamp(15px,2vw,19px);line-height:1.35;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.captions span{background:rgba(0,0,0,.6);padding:2px 8px;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.captions small{display:block;margin-top:6px;font-size:.8em;opacity:.8}
.self{position:absolute;right:12px;top:12px;width:clamp(96px,18%,160px);aspect-ratio:4/3;border-radius:12px;background:linear-gradient(135deg,#2b3a3f,#1e2a2e);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;overflow:hidden}
.self .avatar{width:44%;aspect-ratio:1;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 clamp(14px,2vw,22px) var(--f-display);transition:box-shadow .15s}
.self.live .avatar{box-shadow:0 0 0 4px rgba(88,214,141,.5),0 0 0 9px rgba(88,214,141,.18);animation:breathe 1.2s infinite}
@keyframes breathe{50%{box-shadow:0 0 0 6px rgba(88,214,141,.35),0 0 0 14px rgba(88,214,141,.1)}}
.self small{position:absolute;left:8px;bottom:6px;font-size:11px;color:var(--call-muted)}
.side{display:flex;flex-direction:column;min-height:0;background:var(--call-2);border-radius:18px;overflow:hidden}
.side-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08);gap:8px;flex-wrap:wrap}
.side-head .label{color:var(--call-muted)}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tgl{background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--call-fg);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.tgl[aria-pressed="true"]{background:var(--call-fg);color:var(--call)}
.log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.msg{max-width:92%;display:flex;flex-direction:column;gap:6px}
.msg .bubble{padding:9px 12px;border-radius:14px;line-height:1.45;overflow-wrap:anywhere}
.msg.t{align-self:flex-start}
.msg.t .bubble{background:rgba(255,255,255,.07);border-top-left-radius:4px}
.msg.t .tr{font-size:13px;color:var(--call-muted);padding-left:12px}
.msg.u{align-self:flex-end;align-items:flex-end}
.msg.u .bubble{background:#2a4f58;border-top-right-radius:4px}
.msg .who{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--call-muted)}
.fix{background:#2b1f1d;border:1px solid rgba(255,138,122,.3);border-radius:10px;padding:8px 10px;font-size:13.5px;display:flex;flex-direction:column;gap:3px;width:100%;text-align:left}
.fix del{color:#ff9d90;text-decoration-thickness:1.5px}
.fix ins{color:#8be3b0;text-decoration:none;font-weight:600}
.fix p{margin:0;color:#d8cfcc}
.fix.ok{background:#1b2e24;border-color:rgba(139,227,176,.3)}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{font-size:12px;background:rgba(240,192,90,.12);color:#f3d48f;border-radius:6px;padding:2px 7px}
.typing{color:var(--call-muted);font-size:13px;font-style:italic}
.partial{align-self:flex-end;color:var(--call-muted);font-style:italic;font-size:14px;max-width:92%}
.compose{display:flex;gap:8px;padding:10px;border-top:1px solid rgba(255,255,255,.08)}
.compose input{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:10px 14px;color:var(--call-fg)}
.compose button{border-radius:999px;border:none;background:var(--call-fg);color:var(--call);padding:0 16px;font-weight:600;cursor:pointer}
.controls{display:flex;justify-content:center;align-items:center;gap:14px;padding:14px 16px 16px;flex-wrap:wrap}
.cbtn{width:56px;height:56px;border-radius:50%;border:none;background:#2a3639;color:var(--call-fg);display:grid;place-items:center;cursor:pointer;transition:transform .12s,background .15s}
.cbtn:hover{background:#34444a}
.cbtn:active{transform:scale(.94)}
.cbtn svg{width:24px;height:24px}
.cbtn.mic{width:68px;height:68px;background:#e8ecea;color:#121a1d}
.cbtn.mic.live{background:#58d68d}
.cbtn.end{background:#d64545;color:#fff;width:64px}
.cbtn.end:hover{background:#e25555}
.cbtn:disabled{opacity:.4;cursor:default}
.cbtn-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--call-muted)}

/* ---------- report ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,14,16,.6);z-index:30;display:grid;place-items:center;padding:16px;overflow-y:auto}
.report{background:var(--surface);color:var(--fg);border-radius:20px;max-width:720px;width:100%;padding:26px;display:flex;flex-direction:column;gap:16px;max-height:calc(100% - 16px);overflow-y:auto}
.report h2{font-size:28px}
.report ul{margin:0;padding-left:20px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.notice{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:14px}
@media (max-width:820px){
  .captions{display:none}
  .controls{gap:8px;padding:10px 8px 12px;flex-wrap:nowrap}
  .cbtn{width:46px;height:46px}.cbtn.mic{width:58px;height:58px}.cbtn.end{width:52px}
  .cbtn-wrap{font-size:10px;max-width:64px;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"><div class="onb"><div class="spinner" aria-label="Chargement"></div></div></div>

<script>
"use strict";
/* =========================================================
   Utilities
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
  return el;
}
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => new Date().toISOString();
const fmtDate = iso => { try { return new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "short" }); } catch { return ""; } };
let toastTimer;
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const t = h("div", { class: "toast", role: "status", text: msg });
  document.body.append(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3800);
}
const ICON = {
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',
  end: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-3.3 0-6.3 1-8.6 2.7-.6.4-.8 1.2-.4 1.8l1.4 2.2c.4.6 1.1.8 1.7.5l2.5-1.1c.5-.2.8-.7.8-1.3v-1.6c.8-.3 1.7-.4 2.6-.4s1.8.1 2.6.4v1.6c0 .6.3 1.1.8 1.3l2.5 1.1c.6.3 1.3.1 1.7-.5l1.4-2.2c.4-.6.2-1.4-.4-1.8C18.3 10 15.3 9 12 9z"/></svg>',
  repeat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>',
  slow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>',
  help: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg>'
};

/* =========================================================
   Capabilities
   ========================================================= */
const CAP = { sample: null, tts: null, dictation: null, db: null, user: null };
async function initCaps() {
  if (!window.claude?.use) return;
  const names = Object.keys(CAP);
  const res = await Promise.all(names.map(n => window.claude.use(n).catch(() => null)));
  names.forEach((n, i) => CAP[n] = res[i]);
}
const SAMPLE_ERR = {
  not_granted: "Tu as refusé l'accès à Claude : Elena ne peut pas répondre. Recharge la page pour réessayer.",
  rate_limited: "Trop de demandes d'un coup. Attends quelques secondes puis renvoie ton message.",
  sampling_disabled: "L'accès à Claude est désactivé sur ce compte.",
  prompt_too_large: "La séance est trop longue. Termine-la pour obtenir ton bilan.",
  invalid_json: "Réponse illisible. Renvoie ton message.",
};
const errCopy = e => SAMPLE_ERR[e?.code] || "Elena n'a pas pu répondre. Renvoie ton message.";

/* =========================================================
   Storage: private per-viewer documents in db, localStorage fallback
   ========================================================= */
const Store = {
  uidVal: null,
  async init() {
    if (CAP.db && CAP.user) {
      try { this.uidVal = await CAP.user.id(); } catch { this.uidVal = null; }
    }
  },
  get online() { return !!(CAP.db && this.uidVal); },
  ref(k) { return CAP.db.collection("data/users/" + this.uidVal).doc(k); },
  async get(k) {
    if (this.online) {
      try {
        const snap = await Promise.race([this.ref(k).get(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
        if (snap.exists) return JSON.parse(JSON.stringify(snap.data()));
      } catch (e) { console.warn("db get", e); }
    }
    try { return JSON.parse(localStorage.getItem("elena:" + k)); } catch { return null; }
  },
  queue: {},
  async set(k, v) {
    try { localStorage.setItem("elena:" + k, JSON.stringify(v)); } catch {}
    if (!this.online) return;
    // one write at a time per doc; keep only the latest pending value
    const q = this.queue[k] || (this.queue[k] = { busy: false, next: null });
    q.next = v;
    if (q.busy) return;
    q.busy = true;
    while (q.next) {
      const val = q.next; q.next = null;
      try { await this.ref(k).set(val); }
      catch (e) { console.warn("db set", e); toast("Sauvegarde en ligne impossible. Tes progrès sont gardés sur cet appareil."); }
    }
    q.busy = false;
  }
};

/* =========================================================
   Data model
   ========================================================= */
const LANGS = {

    for (let row = 0; row < 4; row++) {

/* =========================================================
   Voice: TTS (Claude voice, browser fallback) + dictation
   ========================================================= */
const Voice = {
  slow: false,
  stateCb: null,
  init() {
    if (CAP.tts) CAP.tts.onState(({ state }) => this._state(state === "speaking" || state === "starting"));
  },
  _state(on) { Avatar.set({ speaking: on }); this.stateCb?.(on); },
  async speak(text, lang) {
    if (!text) return;
    const rate = this.slow ? .78 : 1;
    if (CAP.tts) {
      try { await CAP.tts.speak(text.slice(0, 2000), { voice: "airy", rate, language: LANGS[lang].tts }); return; }
      catch (e) { if (e?.code === "stopped" || e?.code === "busy") return; console.warn("tts", e); }
    }
    if ("speechSynthesis" in window) {
      return new Promise(res => {
        try {
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = LANGS[lang].stt; u.rate = rate * .95;
          const v = speechSynthesis.getVoices().find(v => v.lang?.startsWith(LANGS[lang].tts));
          if (v) u.voice = v;
          u.onstart = () => this._state(true);
          u.onend = u.onerror = () => { this._state(false); res(); };
          speechSynthesis.speak(u);
        } catch { this._state(false); res(); }
      });
    }
  },
  stop() {
    try { CAP.tts?.stop(); } catch {}
    try { speechSynthesis?.cancel(); } catch {}
    this._state(false);
  }
};

function profileContext(l) {
  const d = S.data[l];
  const weak = d.weaknesses.filter(w => w.count > 0).sort((a, b) => b.count - a.count).slice(0, 8)
    .map(w => `- ${w.label} (vu ${w.count} fois${w.note ? " ; " + w.note : ""})`).join("\n") || "- aucun encore";
  const strong = d.strengths.slice(-6).join(", ") || "aucun noté";
  const last = d.sessions.slice(-3).map(s => `- ${fmtDate(s.date)} : ${s.summary}`).join("\n") || "- première séance";
  const hw = d.homework.slice(-2).map(hw => `- "${hw.title}" (${hw.status === "done" ? "fait, score " + hw.score + "/10" : "pas encore fait"}) : ${hw.focus}`).join("\n") || "- aucun";
  const vocab = d.vocab.slice(-25).map(v => v.word).join(", ") || "aucun";
  return `PROFIL DE L'ÉLÈVE
Prénom : ${S.profile.name}
Langue maternelle : français
Niveau actuel en ${LANGS[l].name.toLowerCase()} : ${d.level}
Points faibles suivis (réutilise ces libellés exacts dans "category" quand ça correspond) :
${weak}
Points forts : ${strong}
Dernières séances :
${last}
Derniers devoirs :
${hw}
Vocabulaire déjà vu récemment : ${vocab}`;
}
function levelBehaviour(l) {
  const lvl = S.data[l].level, i = LEVELS.indexOf(lvl);
  if (l === "es" && i <= 1) return `Niveau débutant complet. Parle en espagnol très simple : phrases de 3 à 8 mots, présent de l'indicatif, vocabulaire du quotidien. Mets TOUJOURS la traduction française de ta réplique dans "translation". Explique la grammaire en français, en une phrase. Introduis au maximum 2 mots nouveaux par réplique et liste-les dans "new_words". Si ${S.profile.name} répond en français ou bloque, donne-lui la phrase espagnole à répéter. Pose des questions fermées ou à choix ("¿Te gusta el café o el té?") pour l'aider à produire. Félicite chaque progrès, sans en faire trop.`;
  if (i <= 3) return `Niveau ${lvl}. Parle en ${l === "es" ? "espagnol" : "anglais"} clair et naturel, phrases courtes à moyennes, en introduisant progressivement de nouveaux temps et tournures. Donne la traduction française dans "translation" seulement pour les phrases difficiles, sinon "". Explications en français.`;
  return `Niveau avancé (${lvl}). Parle en ${l === "es" ? "espagnol" : "anglais"} natif, riche et idiomatique, comme avec un collègue cultivé : débats, nuances, humour, expressions idiomatiques, phrasal verbs, registres. "translation" = "". Corrige aussi ce qui est correct mais pas naturel : collocations, prépositions, faux amis, calques du français, registre, ordre des mots. Explique en français, de façon concise et précise. Pousse ${S.profile.name} vers un niveau C2.`;
}
function rules(l) {
  return `Tu es Elena, professeure particulière d'espagnol et d'anglais (née à Séville, a vécu 10 ans à Londres), chaleureuse, drôle et exigeante. Tu donnes un cours EN VISIO, à l'oral, à ${S.profile.name}. La séance d'aujourd'hui est en ${LANGS[l].name.toLowerCase()}.${S.topic ? ` Thème choisi : ${S.topic}.` : ""}

${profileContext(l)}

COMMENT TU ENSEIGNES
${levelBehaviour(l)}
- Tu mènes une vraie conversation : réagis à ce que dit ${S.profile.name}, partage un peu de toi, puis relance avec UNE question.
- "reply" est dit à voix haute : 1 à 4 phrases, pas de markdown, pas d'emoji, pas de listes. Appelle ${S.profile.name} par son prénom de temps en temps (pas à chaque réplique).

FORMAT : réponds uniquement avec un objet JSON :

async function gradeHomework(l, hw, btn) {
  if (!CAP.sample) { toast("Ouvre cette page dans Claude pour faire corriger tes devoirs."); return; }
  if (hw.exercises.every(ex => !ex.answer?.trim())) { toast("Réponds à au moins un exercice avant de rendre."); return; }
  btn.disabled = true; btn.textContent = "Elena corrige…";
  const prompt = `Tu es Elena, professeure de ${LANGS[l].name.toLowerCase()} de ${S.profile.name} (niveau ${S.data[l].level}, francophone). Corrige ses devoirs.

${profileContext(l)}

DEVOIR : "${hw.title}" — objectif : ${hw.focus}
${hw.exercises.map((ex, i) => `${i + 1}. [${ex.type}] ${ex.prompt}${ex.options ? " (choix : " + ex.options.join(" / ") + ")" : ""}${ex.expected ? "\n   Réponse attendue : " + ex.expected : ""}\n   Réponse de l'élève : ${ex.answer?.trim() || "(pas de réponse)"}`).join("\n")}

Pour chaque exercice : "correct" (true si juste ou acceptable), "feedback" en français (1-2 phrases : la bonne réponse et pourquoi ; pour une production écrite, réécris la version corrigée). Puis une note globale sur 10, un commentaire encourageant en français adressé à ${S.profile.name} (2 phrases), et la mise à jour des points faibles.
Réponds uniquement en JSON :
{"results":[{"correct":true,"feedback":"..."}],"score":7,"comment":"...","weakness_updates":[{"label":"libellé existant ou nouveau","delta":1,"note":"court"}],"strengths":["..."]}
delta = +1 si l'erreur persiste, -1 si le point est maîtrisé.`;
  try {
    const r = await CAP.sample.json(prompt, { cache: false });
    (r.results || []).forEach((res, i) => { if (hw.exercises[i]) { hw.exercises[i].correct = !!res.correct; hw.exercises[i].feedback = String(res.feedback || ""); } });
    hw.score = Math.max(0, Math.min(10, Math.round(Number(r.score) || 0)));
    hw.comment = String(r.comment || "");
    hw.status = "done"; hw.doneAt = today();
    applyWeakness(l, r.weakness_updates); addStrengths(l, r.strengths);

function applyWeakness(l, ups) {
  const d = S.data[l];
  for (const u of Array.isArray(ups) ? ups : []) {
    const label = String(u.label || "").trim(); if (!label) continue;
    let w = d.weaknesses.find(x => x.label.toLowerCase() === label.toLowerCase());
    if (!w) { w = { label, count: 0, first: today() }; d.weaknesses.push(w); }
    const delta = Number(u.delta) || 0;
    w.count = Math.max(0, w.count + delta);
    w.trend = delta < 0 ? "better" : delta > 0 ? "worse" : w.trend;
    if (u.note) w.note = String(u.note).slice(0, 120);
    w.last = today();
  }
  d.weaknesses = d.weaknesses.filter(w => w.count > 0 || w.trend === "better").slice(-40);
}
function addStrengths(l, arr) {
  const d = S.data[l];
  for (const s of Array.isArray(arr) ? arr : []) { const v = String(s).trim(); if (v && !d.strengths.includes(v)) d.strengths.push(v); }
  d.strengths = d.strengths.slice(-20);
}

function setupMic(btn) {
  const d = CAP.dictation; if (!d) return;
  const self = $("#self");
  let partialEl = null;
  const offs = [
    d.onPartial(({ text }) => {
      if (!partialEl) { partialEl = h("div", { class: "partial" }); $("#log")?.append(partialEl); }
      partialEl.textContent = [...C.finals, text].join(" ");
      scrollLog();
    }),
    d.onFinal(({ text }) => { if (text.trim()) C.finals.push(text.trim()); if (partialEl) partialEl.textContent = C.finals.join(" "); }),
    d.onState(({ state, reason }) => {
      const live = state === "listening" || state === "starting";
      C.listening = live;
      btn.classList.toggle("live", live); btn.innerHTML = live ? ICON.stop : ICON.mic;
      btn.setAttribute("aria-label", live ? "Arrêter et envoyer" : "Parler");
      const lab = $("#mic-label"); if (lab) lab.textContent = live ? "J'écoute… (appuie pour envoyer)" : "Parler";
      self?.classList.toggle("live", live);
      Avatar.set({ listening: live });
      if (state === "idle") {
        partialEl?.remove(); partialEl = null;
        const said = C.finals.join(" ").trim(); C.finals = [];
        if (said) userSays(said, true);
        if (reason === "not_granted") { btn.disabled = true; if (lab) lab.textContent = "Micro refusé"; toast("Micro refusé : tu peux écrire tes réponses."); }
      }
    })
  ];
  C.micOffs = offs;
  btn.onclick = () => {
    if (C.listening) { d.stop().catch(() => {}); return; }
    Voice.stop();
    C.finals = [];
    d.start({ language: LANGS[S.cur].stt }).catch(e => {
      if (e?.code === "not_granted") { btn.disabled = true; toast("Micro refusé : tu peux écrire tes réponses."); }
      else if (e?.code === "dismissed") toast("Autorise le micro pour parler avec Elena.");
      else if (e?.code !== "stopped") toast("Le micro n'a pas démarré. Réessaie ou écris ta réponse.");
    });
  };
}

function scrollLog() { const lg = $("#log"); if (lg) lg.scrollTop = lg.scrollHeight; }

function userSays(text, oral, isHelp) {
  if (C.busy) { toast("Attends qu'Elena ait répondu."); return; }
  const bubble = h("div", { class: "msg u" + (isHelp ? " help" : "") }, h("span", { class: "who", text: S.profile.name }), h("div", { class: "bubble", text: text }));
  $("#log")?.append(bubble); scrollLog();
  if (!isHelp) C.log.push({ who: "student", text });
  teacherTurn((oral ? "[oral] " : "") + text, false, bubble);
}

async function teacherTurn(content, opening, userBubble) {
  const l = S.cur;
  C.busy = true;
  Avatar.set({ thinking: true }); Voice.stateCb?.(false);
  const typing = h("div", { class: "typing", text: "Elena réfléchit…" });
  $("#log")?.append(typing); scrollLog();
  C.turns.push({ role: "user", content });
  // keep the conversation compact: instructions + last 24 turns
  const recent = C.turns.slice(-24);
  while (recent.length && recent[0].role !== "user") recent.shift();
  const input = [{ role: "user", content: rules(l) }, ...recent];
  input[input.length - 1] = { role: "user", content: input.at(-1).content + "\n\n(Réponds avec l'objet JSON demandé.)" };
  if (input.length >= 2 && input[1].role === "user") input.splice(0, 2, { role: "user", content: input[0].content + "\n\n---\n\n" + input[1].content });
  C.ctl = new AbortController();
  try {
    const r = await CAP.sample.json(input, { modelTier: "quick", cache: false, signal: C.ctl.signal });
    typing.remove();
    const reply = String(r?.reply || "").trim() || "…";
    const tr = String(r?.translation || "").trim();
    const fixes = (Array.isArray(r?.corrections) ? r.corrections : []).filter(c => c && c.original && c.corrected && String(c.original).trim() !== String(c.corrected).trim());
    const words = (Array.isArray(r?.new_words) ? r.new_words : []).filter(w => w && w.word);
    C.turns.push({ role: "assistant", content: reply });
    C.lastReply = reply;
    if (userBubble && !opening && !userBubble.classList.contains("help")) {
      if (fixes.length) fixes.forEach(f => {
        userBubble.append(h("div", { class: "fix" },
          h("div", null, h("del", { text: f.original }), "  →  ", h("ins", { text: f.corrected })),
          f.explanation ? h("p", { text: f.explanation }) : null));
        C.errors.push({ original: String(f.original), corrected: String(f.corrected), explanation: String(f.explanation || ""), category: String(f.category || "divers") });
      });
      else if (C.log.length) userBubble.append(h("div", { class: "fix ok" }, h("p", { text: l === "es" ? "¡Perfecto! Aucune erreur." : "Spot on. No mistakes." })));
    }
    words.forEach(w => C.words.push({ word: String(w.word), meaning: String(w.meaning || "") }));
    C.log.push({ who: "teacher", text: reply });
    const msg = h("div", { class: "msg t" }, h("span", { class: "who", text: "Elena" }), h("div", { class: "bubble", text: reply }),
      tr ? h("div", { class: "tr", hidden: !C.showTr, text: tr }) : null,
      words.length ? h("div", { class: "words" }, words.map(w => h("span", { text: `${w.word} = ${w.meaning}` }))) : null);
    $("#log")?.append(msg); scrollLog();
    const cap = $("#captions");
    if (cap) { cap.replaceChildren(h("span", { text: reply }), tr ? h("small", { hidden: !C.showTr }, h("span", { text: tr })) : ""); }
    C.busy = false;
    Avatar.set({ thinking: false });
    await Voice.speak(reply, l);
  } catch (e) {
    typing.remove();
    C.turns.pop();
    C.busy = false; Avatar.set({ thinking: false }); Voice.stateCb?.(false);
    if (e?.code === "cancelled") return;
    $("#log")?.append(h("div", { class: "typing", text: errCopy(e) })); scrollLog();
    if (e?.code === "not_granted") { $("#mic") && ($("#mic").disabled = true); }
  }
}

function closeCall() {
  clearInterval(C.timer);
  C.ctl?.abort();
  Voice.stop();
  try { if (CAP.dictation?.active()) CAP.dictation.stop(); } catch {}
  (C.micOffs || []).forEach(f => { try { f(); } catch {} });
  Avatar.set({ listening: false, thinking: false, speaking: false });
  document.querySelector(".call")?.remove();
}

  const card = h("div", { class: "report", role: "dialog", "aria-label": "Bilan de séance" },
    h("div", { style: "display:flex;gap:14px;align-items:center" }, h("div", { class: "spinner" }),
      h("div", null, h("h2", { text: "Elena prépare ton bilan" }), h("p", { class: "muted", style: "margin:0", text: "Résumé, erreurs à retenir et devoirs adaptés à tes points faibles. Ça peut prendre une minute." }))));
  const ov = h("div", { class: "overlay" }, card);
  document.body.append(ov);
  const d = S.data[l];
  const transcript = C.log.map(x => (x.who === "student" ? S.profile.name : "Elena") + " : " + x.text).join("\n").slice(-14000);
  const errs = C.errors.map(e => `- « ${e.original} » → « ${e.corrected} » [${e.category}] ${e.explanation}`).join("\n").slice(-6000) || "- aucune erreur relevée";
  const prompt = `Tu es Elena, professeure particulière de ${LANGS[l].name.toLowerCase()}. La séance en visio avec ${S.profile.name} vient de se terminer (${minutes} min). Rédige le bilan et les devoirs.

${profileContext(l)}

TRANSCRIPTION
${transcript}

ERREURS CORRIGÉES PENDANT LA SÉANCE
${errs}

À FAIRE
1. "summary" : 1 phrase en français, ce qu'on a fait (pour l'historique).
2. "message" : 2-3 phrases chaleureuses adressées à ${S.profile.name} en français : ce qui s'est bien passé, ce qu'il faut travailler.
3. "top_mistakes" : les 3 à 5 erreurs les plus importantes à retenir (forme correcte + règle courte).
4. "weakness_updates" : mets à jour les points faibles. Réutilise les libellés existants quand c'est le même type d'erreur. delta = nombre d'occurrences aujourd'hui (positif), ou -1 pour un point faible existant que ${S.profile.name} a bien utilisé aujourd'hui.
5. "strengths" : 0 à 3 points forts nouveaux et précis.
6. "level" : niveau CECRL estimé (${LEVELS.join(", ")}). Ne change le niveau actuel (${d.level}) que si la séance le justifie clairement ; progression d'un cran maximum.
7. "homework" : des devoirs CIBLÉS sur les points faibles les plus fréquents (anciens et nouveaux), adaptés au niveau : 5 à 7 exercices variés. Types : "fill" (phrase à trous avec ___), "translate" (traduire du français vers la langue du cours), "qcm" (avec "options", 3 choix), "write" (petite production : ${LEVELS.indexOf(d.level) <= 1 ? "2-3 phrases simples" : "un paragraphe de 80-120 mots"} sur un sujet lié à la séance). Mets la réponse attendue dans "expected" (sauf pour "write"). Consignes en français.
8. "next_goal" : l'objectif de la prochaine séance, en une phrase.

Réponds uniquement en JSON :
{"summary":"...","message":"...","top_mistakes":[{"wrong":"...","right":"...","rule":"..."}],"weakness_updates":[{"label":"...","delta":2,"note":"..."}],"strengths":["..."],"level":"${d.level}","homework":{"title":"...","focus":"points travaillés","exercises":[{"type":"fill","prompt":"...","hint":"...","expected":"..."},{"type":"qcm","prompt":"...","options":["...","...","..."],"expected":"..."}]},"next_goal":"..."}`;
  let r;
  try { r = await CAP.sample.json(prompt, { cache: false }); }
  catch (e) {
    // keep a minimal record even without a report
    d.sessions.push({ date: today(), minutes, errors: C.errors.length, summary: `Conversation${S.topic ? " : " + S.topic : ""} (bilan non généré)` });
    applyWeakness(l, Object.entries(C.errors.reduce((a, x) => (a[x.category] = (a[x.category] || 0) + 1, a), {})).map(([label, delta]) => ({ label, delta })));
    saveLang(l);
    card.replaceChildren(h("h2", { text: "Bilan indisponible" }), h("p", { text: errCopy(e) + " Tes erreurs de la séance ont quand même été ajoutées à tes points faibles." }),
      h("button", { class: "btn primary", onclick: () => { ov.remove(); renderLobby(); }, text: "Retour" }));
    return;
  }
  const oldLevel = d.level;
  if (LEVELS.includes(r.level)) d.level = r.level;
  applyWeakness(l, r.weakness_updates); addStrengths(l, r.strengths);
  const seen = new Set(d.vocab.map(v => v.word.toLowerCase()));
  C.words.forEach(w => { if (!seen.has(w.word.toLowerCase())) { d.vocab.push(w); seen.add(w.word.toLowerCase()); } });
  d.vocab = d.vocab.slice(-150);
  d.sessions.push({ date: today(), minutes, errors: C.errors.length, summary: String(r.summary || "Conversation"), next: String(r.next_goal || "") });
  d.sessions = d.sessions.slice(-30);
  const hwIn = r.homework;
  if (hwIn && Array.isArray(hwIn.exercises) && hwIn.exercises.length) {
    d.homework.push({ id: uid(), date: today(), title: String(hwIn.title || "Devoirs"), focus: String(hwIn.focus || ""), status: "todo",
      exercises: hwIn.exercises.slice(0, 8).map(ex => ({ type: ["fill", "translate", "qcm", "write"].includes(ex.type) ? ex.type : "translate", prompt: String(ex.prompt || ""), hint: ex.hint ? String(ex.hint) : "", options: Array.isArray(ex.options) ? ex.options.map(String).slice(0, 5) : undefined, expected: ex.expected ? String(ex.expected) : "" })) });
    d.homework = d.homework.slice(-12);
  }
  saveLang(l);
  const mistakes = Array.isArray(r.top_mistakes) ? r.top_mistakes : [];
  card.replaceChildren(
    h("span", { class: "label", text: `Bilan · ${minutes} min · ${C.errors.length} correction${C.errors.length > 1 ? "s" : ""}` }),
    h("h2", { text: l === "es" ? `¡Buen trabajo, ${S.profile.name}!` : `Well done, ${S.profile.name}!` }),
    h("p", { style: "margin:0", text: String(r.message || "") }),
    d.level !== oldLevel ? h("p", { class: "notice", text: `Nouveau niveau estimé : ${oldLevel} → ${d.level}` }) : null,
    mistakes.length ? h("div", null, h("h3", { style: "font-size:16px;margin-bottom:8px", text: "À retenir" }),
      h("div", { style: "display:flex;flex-direction:column;gap:8px" }, mistakes.map(m => h("div", { class: "hw" },
        h("div", null, h("del", { style: "color:var(--err)", text: String(m.wrong || "") }), "  →  ", h("strong", { style: "color:var(--ok)", text: String(m.right || "") })),
        m.rule ? h("small", { class: "muted", text: String(m.rule) }) : null)))) : null,
    hwIn?.exercises?.length ? h("p", { class: "notice", text: `Devoirs : « ${hwIn.title} », ${hwIn.exercises.length} exercices ciblés sur ${hwIn.focus}. Tu les trouveras dans ton carnet.` }) : null,
    r.next_goal ? h("p", { class: "muted", style: "margin:0", text: "Prochaine séance : " + r.next_goal }) : null,
    h("button", { class: "btn primary", style: "align-self:flex-start", onclick: () => { ov.remove(); renderLobby(); }, text: "Voir mes devoirs" }));
}

/* =========================================================
   Boot
   ========================================================= */
(async function boot() {
  await initCaps();
  await Store.init();
  await loadAll();
  if (S.profile?.name) {
    S.data.es = S.data.es || newLang("A0");
    S.data.en = S.data.en || newLang("C1");
  }
  Voice.init();
  render();
})();
</script>
